<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Gradients for realistic clay/earthen plaques -->
    <radialGradient id="plaqueTerracotta" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#84391F" />
      <stop offset="65%" stop-color="#5B210F" />
      <stop offset="100%" stop-color="#3D1409" />
    </radialGradient>
    
    <radialGradient id="plaqueGreen" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#365E2D" />
      <stop offset="70%" stop-color="#23421C" />
      <stop offset="100%" stop-color="#142810" />
    </radialGradient>

    <radialGradient id="plaqueOchre" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C98B32" />
      <stop offset="75%" stop-color="#9B621E" />
      <stop offset="100%" stop-color="#6E4010" />
    </radialGradient>

    <radialGradient id="plaqueChowk" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7B321B" />
      <stop offset="75%" stop-color="#551E0E" />
      <stop offset="100%" stop-color="#381107" />
    </radialGradient>

    <!-- Drop shadows -->
    <filter id="shadowDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="shadowSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Bottom border pattern tile -->
    <pattern id="warliBorder" x="0" y="0" width="120" height="46" patternUnits="userSpaceOnUse">
      <!-- Background of border band -->
      <rect width="120" height="46" fill="#B4ABA0" />
      <!-- Top and bottom thin lines -->
      <line x1="0" y1="3" x2="120" y2="3" stroke="#1A1A1A" stroke-width="1.5" />
      <line x1="0" y1="7" x2="120" y2="7" stroke="#1A1A1A" stroke-width="1" />
      <line x1="0" y1="39" x2="120" y2="39" stroke="#1A1A1A" stroke-width="1" />
      <line x1="0" y1="43" x2="120" y2="43" stroke="#1A1A1A" stroke-width="1.5" />
      <!-- Palm Tree motif -->
      <line x1="20" y1="12" x2="20" y2="36" stroke="#1A1A1A" stroke-width="2" />
      <path d="M12,18 Q20,13 28,18 M10,23 Q20,16 30,23 M13,28 Q20,22 27,28 M16,33 Q20,29 24,33" fill="none" stroke="#1A1A1A" stroke-width="1.5" />
      <circle cx="20" cy="11" r="2" fill="#1A1A1A" />
      <!-- Stylized Warli Dancers -->
      <circle cx="50" cy="16" r="2.5" fill="#1A1A1A" />
      <polygon points="50,19 45,26 55,26" fill="#1A1A1A" />
      <polygon points="50,33 45,26 55,26" fill="#1A1A1A" />
      <line x1="45" y1="26" x2="38" y2="23" stroke="#1A1A1A" stroke-width="1.5" />
      <line x1="55" y1="26" x2="62" y2="23" stroke="#1A1A1A" stroke-width="1.5" />
      <line x1="48" y1="33" x2="45" y2="38" stroke="#1A1A1A" stroke-width="1.5" />
      <line x1="52" y1="33" x2="55" y2="38" stroke="#1A1A1A" stroke-width="1.5" />
      <!-- Palm Tree motif 2 -->
      <line x1="80" y1="12" x2="80" y2="36" stroke="#1A1A1A" stroke-width="2" />
      <path d="M72,18 Q80,13 88,18 M70,23 Q80,16 90,23 M73,28 Q80,22 87,28 M76,33 Q80,29 84,33" fill="none" stroke="#1A1A1A" stroke-width="1.5" />
      <circle cx="80" cy="11" r="2" fill="#1A1A1A" />
      <!-- Second Dancer -->
      <circle cx="106" cy="16" r="2.5" fill="#1A1A1A" />
      <polygon points="106,19 101,26 111,26" fill="#1A1A1A" />
      <polygon points="106,33 101,26 111,26" fill="#1A1A1A" />
      <line x1="101" y1="26" x2="94" y2="23" stroke="#1A1A1A" stroke-width="1.5" />
      <line x1="111" y1="26" x2="118" y2="23" stroke="#1A1A1A" stroke-width="1.5" />
      <line x1="104" y1="33" x2="101" y2="38" stroke="#1A1A1A" stroke-width="1.5" />
      <line x1="108" y1="33" x2="111" y2="38" stroke="#1A1A1A" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="720" fill="#0C0C0C" />

  <!-- Subtle vignette/glow behind artwork -->
  <circle cx="950" cy="360" r="450" fill="#181512" opacity="0.6" />

  <!-- TOP RIGHT TEXT: CULTURAL STUDIES IN UX DESIGN -->
  <g id="header-label" fill="#E8E6E0" opacity="0.9">
    <text x="1170" y="58" font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="3" text-anchor="end">CULTURAL STUDIES IN</text>
    <text x="1170" y="76" font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="3" text-anchor="end">UX DESIGN</text>
  </g>

  <!-- MAIN TITLE: Tribes of Maharashtra -->
  <g id="main-title" fill="#F7F5F0">
    <text x="100" y="355" font-family="'Georgia', 'Times New Roman', serif" font-size="78" font-weight="normal" letter-spacing="1">Tribes of</text>
    <text x="100" y="445" font-family="'Georgia', 'Times New Roman', serif" font-size="78" font-weight="normal" letter-spacing="1">Maharashtra</text>
  </g>

  <!-- ============================================================ -->
  <!-- PLAQUE 1: Top Main Large Terracotta Plaque (Tarpa / Circle Dance) -->
  <!-- ============================================================ -->
  <g transform="translate(830, 130) rotate(-18)" filter="url(#shadowDepth)">
    <!-- Outer rim -->
    <ellipse cx="0" cy="0" rx="205" ry="155" fill="url(#plaqueTerracotta)" stroke="#D4A373" stroke-width="4" />
    <!-- Intricate Rim Pattern (triangles) -->
    <ellipse cx="0" cy="0" rx="192" ry="142" fill="none" stroke="#F5EDE0" stroke-width="1.5" stroke-dasharray="4,4" />
    <ellipse cx="0" cy="0" rx="183" ry="133" fill="none" stroke="#D4A373" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="174" ry="125" fill="none" stroke="#F5EDE0" stroke-width="1" />

    <!-- Thatched Hut / House at center top -->
    <g transform="translate(0, -50)" stroke="#F5EDE0" fill="#F5EDE0">
      <!-- Roof triangle hatch -->
      <polygon points="0,-42 -42,-8 42,-8" fill="none" stroke-width="2.5" />
      <line x1="-35" y1="-14" x2="-20" y2="-32" stroke-width="1.5" />
      <line x1="-20" y1="-8" x2="-5" y2="-38" stroke-width="1.5" />
      <line x1="0" y1="-8" x2="0" y2="-42" stroke-width="1.5" />
      <line x1="20" y1="-8" x2="5" y2="-38" stroke-width="1.5" />
      <line x1="35" y1="-14" x2="20" y2="-32" stroke-width="1.5" />
      <!-- Walls -->
      <rect x="-35" y="-8" width="70" height="34" fill="none" stroke-width="2" />
      <!-- Door -->
      <rect x="-10" y="6" width="20" height="20" fill="#F5EDE0" />
      <!-- Window grid -->
      <rect x="-26" y="0" width="10" height="10" fill="none" stroke-width="1.5" />
      <rect x="16" y="0" width="10" height="10" fill="none" stroke-width="1.5" />
      <!-- Sun -->
      <circle cx="58" cy="-34" r="7" fill="none" stroke-width="2" />
      <line x1="58" y1="-46" x2="58" y2="-42" stroke-width="1.5" />
      <line x1="58" y1="-26" x2="58" y2="-22" stroke-width="1.5" />
      <line x1="46" y1="-34" x2="50" y2="-34" stroke-width="1.5" />
      <line x1="66" y1="-34" x2="70" y2="-34" stroke-width="1.5" />
      <!-- Sacred Tree next to hut -->
      <line x1="68" y1="26" x2="68" y2="-12" stroke-width="2" />
      <path d="M68,-12 Q52,-20 48,-28 M68,-8 Q84,-16 88,-24 M68,0 Q54,-6 50,-12 M68,8 Q82,2 86,-4" fill="none" stroke-width="1.8" />
    </g>

    <!-- Circular Warli Dancers holding hands in dynamic arc -->
    <g stroke="#F5EDE0" fill="#F5EDE0">
      <!-- DANCER 1 -->
      <g transform="translate(-110, 10)">
        <circle cx="0" cy="-14" r="5" />
        <polygon points="0,-9 -10,6 10,6" />
        <polygon points="0,18 -10,6 10,6" />
        <line x1="-10" y1="6" x2="-22" y2="0" stroke-width="2.2" />
        <line x1="10" y1="6" x2="22" y2="4" stroke-width="2.2" />
        <line x1="-4" y1="18" x2="-10" y2="32" stroke-width="2.2" />
        <line x1="4" y1="18" x2="10" y2="32" stroke-width="2.2" />
      </g>
      <!-- DANCER 2 -->
      <g transform="translate(-68, 16)">
        <circle cx="0" cy="-14" r="5" />
        <polygon points="0,-9 -10,6 10,6" />
        <polygon points="0,18 -10,6 10,6" />
        <line x1="-10" y1="6" x2="-20" y2="2" stroke-width="2.2" />
        <line x1="10" y1="6" x2="20" y2="4" stroke-width="2.2" />
        <line x1="-4" y1="18" x2="-8" y2="34" stroke-width="2.2" />
        <line x1="4" y1="18" x2="8" y2="34" stroke-width="2.2" />
      </g>
      <!-- DANCER 3 -->
      <g transform="translate(-24, 20)">
        <circle cx="0" cy="-14" r="5" />
        <polygon points="0,-9 -10,6 10,6" />
        <polygon points="0,18 -10,6 10,6" />
        <line x1="-10" y1="6" x2="-20" y2="2" stroke-width="2.2" />
        <line x1="10" y1="6" x2="20" y2="4" stroke-width="2.2" />
        <line x1="-4" y1="18" x2="-7" y2="36" stroke-width="2.2" />
        <line x1="4" y1="18" x2="7" y2="36" stroke-width="2.2" />
      </g>
      <!-- DANCER 4 -->
      <g transform="translate(20, 20)">
        <circle cx="0" cy="-14" r="5" />
        <polygon points="0,-9 -10,6 10,6" />
        <polygon points="0,18 -10,6 10,6" />
        <line x1="-10" y1="6" x2="-20" y2="4" stroke-width="2.2" />
        <line x1="10" y1="6" x2="20" y2="2" stroke-width="2.2" />
        <line x1="-4" y1="18" x2="-7" y2="36" stroke-width="2.2" />
        <line x1="4" y1="18" x2="7" y2="36" stroke-width="2.2" />
      </g>
      <!-- DANCER 5 -->
      <g transform="translate(64, 16)">
        <circle cx="0" cy="-14" r="5" />
        <polygon points="0,-9 -10,6 10,6" />
        <polygon points="0,18 -10,6 10,6" />
        <line x1="-10" y1="6" x2="-20" y2="4" stroke-width="2.2" />
        <line x1="10" y1="6" x2="20" y2="2" stroke-width="2.2" />
        <line x1="-4" y1="18" x2="-8" y2="34" stroke-width="2.2" />
        <line x1="4" y1="18" x2="8" y2="34" stroke-width="2.2" />
      </g>
      <!-- DANCER 6 -->
      <g transform="translate(106, 10)">
        <circle cx="0" cy="-14" r="5" />
        <polygon points="0,-9 -10,6 10,6" />
        <polygon points="0,18 -10,6 10,6" />
        <line x1="-10" y1="6" x2="-20" y2="4" stroke-width="2.2" />
        <line x1="10" y1="6" x2="22" y2="0" stroke-width="2.2" />
        <line x1="-4" y1="18" x2="-10" y2="32" stroke-width="2.2" />
        <line x1="4" y1="18" x2="10" y2="32" stroke-width="2.2" />
      </g>
    </g>

    <!-- Bottom rim triangles -->
    <path d="M-150,90 Q0,130 150,90" fill="none" stroke="#F5EDE0" stroke-width="2" />
    <path d="M-155,98 Q0,138 155,98" fill="none" stroke="#D4A373" stroke-width="1.5" />
  </g>

  <!-- ============================================================ -->
  <!-- PLAQUE 2: Middle-Right Terracotta Ritual Grid / Chowk Plaque -->
  <!-- ============================================================ -->
  <g transform="translate(1190, 420) rotate(-14)" filter="url(#shadowDepth)">
    <ellipse cx="0" cy="0" rx="145" ry="215" fill="url(#plaqueChowk)" stroke="#C68B59" stroke-width="4" />
    <ellipse cx="0" cy="0" rx="133" ry="200" fill="none" stroke="#F5EDE0" stroke-width="2" stroke-dasharray="5,5" />
    <ellipse cx="0" cy="0" rx="122" ry="186" fill="none" stroke="#D4A373" stroke-width="1.5" />

    <!-- Sacred Chowk / Geometric Grid Pattern in White -->
    <g stroke="#F5EDE0" fill="#F5EDE0" stroke-width="2">
      <!-- Central nested diamond squares -->
      <polygon points="0,-120 75,0 0,120 -75,0" fill="none" stroke-width="3" />
      <polygon points="0,-90 55,0 0,90 -55,0" fill="none" stroke-width="2" stroke-dasharray="4,4" />
      <polygon points="0,-60 38,0 0,60 -38,0" fill="none" stroke-width="2" />
      <polygon points="0,-30 18,0 0,30 -18,0" fill="#F5EDE0" />

      <!-- Radiating lines and ceremonial triangles -->
      <line x1="-75" y1="0" x2="-110" y2="0" stroke-width="2.5" />
      <line x1="75" y1="0" x2="110" y2="0" stroke-width="2.5" />
      <line x1="0" y1="-120" x2="0" y2="-160" stroke-width="2.5" />
      <line x1="0" y1="120" x2="0" y2="160" stroke-width="2.5" />

      <circle cx="-95" cy="-70" r="4" />
      <circle cx="95" cy="-70" r="4" />
      <circle cx="-95" cy="70" r="4" />
      <circle cx="95" cy="70" r="4" />

      <!-- Border chevrons -->
      <polygon points="-50,-120 -40,-135 -30,-120" />
      <polygon points="30,-120 40,-135 50,-120" />
      <polygon points="-50,120 -40,135 -30,120" />
      <polygon points="30,120 40,135 50,120" />
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- PLAQUE 3: Middle Circular Forest Green Plaque (Tree of Life + Deer) -->
  <!-- ============================================================ -->
  <g transform="translate(935, 600)" filter="url(#shadowDepth)">
    <circle cx="0" cy="0" r="138" fill="url(#plaqueGreen)" stroke="#C69248" stroke-width="5" />
    <circle cx="0" cy="0" r="126" fill="none" stroke="#F5EDE0" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="118" fill="none" stroke="#90A955" stroke-width="1.5" />

    <!-- Central Sacred Tree with lush organic canopy -->
    <g stroke="#F5EDE0" fill="#F5EDE0">
      <!-- Trunk and thick roots -->
      <path d="M-6,70 L-5,-20 Q-20,-45 -48,-65 M-2,-20 Q0,-55 0,-85 M4,-20 Q25,-45 52,-65" fill="none" stroke-width="4.5" stroke-linecap="round" />
      <!-- Branches -->
      <path d="M-15,-38 Q-38,-40 -58,-32 M-25,-50 Q-48,-68 -62,-80 M16,-38 Q42,-40 60,-32 M25,-50 Q46,-68 62,-80 M-6,-62 Q-20,-78 -24,-96 M8,-62 Q20,-78 26,-96" fill="none" stroke-width="2.5" stroke-linecap="round" />
      <!-- Leaf Clusters (Warli teardrop pairs) -->
      <circle cx="-58" cy="-32" r="3.5" fill="#C9DF8A" />
      <circle cx="-62" cy="-80" r="3.5" fill="#C9DF8A" />
      <circle cx="60" cy="-32" r="3.5" fill="#C9DF8A" />
      <circle cx="62" cy="-80" r="3.5" fill="#C9DF8A" />
      <circle cx="-24" cy="-96" r="3.5" fill="#C9DF8A" />
      <circle cx="26" cy="-96" r="3.5" fill="#C9DF8A" />
      <circle cx="0" cy="-88" r="4" fill="#E9F5DB" />
      <circle cx="-40" cy="-62" r="3.5" fill="#C9DF8A" />
      <circle cx="42" cy="-62" r="3.5" fill="#C9DF8A" />
      <circle cx="-32" cy="-28" r="3" fill="#C9DF8A" />
      <circle cx="34" cy="-28" r="3" fill="#C9DF8A" />

      <!-- DEER LEFT (grazing under tree) -->
      <g transform="translate(-52, 45)">
        <!-- Body: two triangles -->
        <polygon points="-16,0 4,-6 4,6" fill="#E3B374" />
        <polygon points="18,0 4,-6 4,6" fill="#E3B374" />
        <!-- Neck & Head -->
        <line x1="-14" y1="-3" x2="-22" y2="-18" stroke="#E3B374" stroke-width="2.5" />
        <polygon points="-22,-18 -26,-24 -18,-22" fill="#E3B374" />
        <!-- Antlers -->
        <line x1="-24" y1="-23" x2="-28" y2="-32" stroke="#F5EDE0" stroke-width="1.5" />
        <path d="M-28,-32 Q-32,-35 -30,-38 M-27,-28 Q-32,-30 -34,-28" fill="none" stroke="#F5EDE0" stroke-width="1.2" />
        <!-- Legs -->
        <line x1="-10" y1="5" x2="-12" y2="24" stroke="#E3B374" stroke-width="2" />
        <line x1="-5" y1="5" x2="-6" y2="24" stroke="#E3B374" stroke-width="2" />
        <line x1="10" y1="5" x2="8" y2="24" stroke="#E3B374" stroke-width="2" />
        <line x1="15" y1="5" x2="16" y2="24" stroke="#E3B374" stroke-width="2" />
        <!-- Tail -->
        <line x1="17" y1="-2" x2="22" y2="-8" stroke="#E3B374" stroke-width="2" />
      </g>

      <!-- DEER RIGHT -->
      <g transform="translate(34, 48)">
        <polygon points="14,0 -4,-5 -4,5" fill="#E3B374" />
        <polygon points="-16,0 -4,-5 -4,5" fill="#E3B374" />
        <line x1="-12" y1="-2" x2="-18" y2="-16" stroke="#E3B374" stroke-width="2.5" />
        <polygon points="-18,-16 -22,-20 -15,-19" fill="#E3B374" />
        <!-- Legs -->
        <line x1="-8" y1="5" x2="-9" y2="22" stroke="#E3B374" stroke-width="2" />
        <line x1="8" y1="5" x2="7" y2="22" stroke="#E3B374" stroke-width="2" />
      </g>

      <!-- Peacock on right branch -->
      <g transform="translate(68, 42)">
        <ellipse cx="0" cy="0" rx="8" ry="14" fill="#3D7B80" />
        <circle cx="3" cy="-15" r="3.5" fill="#3D7B80" />
        <path d="M2,-18 Q4,-23 2,-25" fill="none" stroke="#F5EDE0" stroke-width="1.2" />
        <path d="M-2,10 Q-8,22 -6,30" fill="none" stroke="#C9DF8A" stroke-width="2" />
      </g>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- PLAQUE 4: Bottom-Right Ochre Plaque (Archers & Hunting) -->
  <!-- ============================================================ -->
  <g transform="translate(1190, 780)" filter="url(#shadowDepth)">
    <circle cx="0" cy="0" r="120" fill="url(#plaqueOchre)" stroke="#6E3D12" stroke-width="4.5" />
    <circle cx="0" cy="0" r="108" fill="none" stroke="#F5EDE0" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Tribal Archers with Bow and Arrows -->
    <g stroke="#1A140E" fill="#1A140E">
      <!-- Sun -->
      <circle cx="0" cy="-65" r="7" fill="none" stroke-width="2" />
      <!-- Archer 1 Left -->
      <g transform="translate(-38, -15)">
        <circle cx="0" cy="-14" r="5" />
        <polygon points="0,-9 -9,5 9,5" />
        <polygon points="0,17 -9,5 9,5" />
        <!-- Bow -->
        <path d="M-18,-24 Q-28,4 -18,24" fill="none" stroke-width="2.5" />
        <line x1="-18" y1="-24" x2="-18" y2="24" stroke-width="1" />
        <line x1="-18" y1="0" x2="6" y2="0" stroke-width="2" />
        <!-- Legs -->
        <line x1="-4" y1="17" x2="-12" y2="34" stroke-width="2.2" />
        <line x1="4" y1="17" x2="10" y2="34" stroke-width="2.2" />
      </g>
      <!-- Archer 2 Right with drawn bow -->
      <g transform="translate(36, -15)">
        <circle cx="0" cy="-14" r="5" />
        <polygon points="0,-9 -9,5 9,5" />
        <polygon points="0,17 -9,5 9,5" />
        <path d="M22,-24 Q32,4 22,24" fill="none" stroke-width="2.5" />
        <line x1="22" y1="-24" x2="22" y2="24" stroke-width="1" />
        <line x1="-6" y1="0" x2="22" y2="0" stroke-width="2" />
        <line x1="-4" y1="17" x2="-10" y2="34" stroke-width="2.2" />
        <line x1="4" y1="17" x2="12" y2="34" stroke-width="2.2" />
      </g>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- BOTTOM WARLI BORDER FRIEZE -->
  <!-- ============================================================ -->
  <g id="bottom-border" transform="translate(0, 674)">
    <rect width="1280" height="46" fill="url(#warliBorder)" />
  </g>
</svg>
