  if (ph.length <= 1){ toast(L2("Keep at least one photo.","किमान एक फोटो ठेवा.","कम से कम एक फोटो रखिए.")); return; }
  ph.splice(+i,1); draft.photos = ph; draft.photo = ph[0]; save(); K.rerender();
});
act("sayListing", function(){ Voice.speak(draft.name+". "+(draft.story||"")+". "+(draft.size||"")+". "+(draft.time||"")); });
act("reviewEdit", function(){
  K.sheet('<div class="ask" style="font-size:20px">'+esc(t("edit"))+'</div>'+
    '<div style="margin-top:14px"><div class="label">'+esc(t("qProdName"))+'</div><input class="field" id="re_name" value="'+esc(draft.name)+'"></div>'+
    '<div style="margin-top:14px"><div class="label">'+esc(t("qProdStory"))+'</div><textarea class="field" id="re_story">'+esc(draft.story)+'</textarea></div>'+
    '<div style="margin-top:14px"><div class="label">'+esc(t("qSize"))+'</div><input class="field" id="re_size" value="'+esc(draft.size)+'"></div>'+
    '<button class="cta" data-act="reSave" style="margin-top:18px">'+esc(t("save"))+'</button>');
});
act("reSave", function(){
  draft.name = document.getElementById("re_name").value.trim();
  draft.story = document.getElementById("re_story").value.trim();
  draft.size = document.getElementById("re_size").value.trim();
  save(); K.closeSheet(); K.rerender();
});
act("toPrice", function(){ if (draft.price) go("publishNow"); else go("priceAsk"); });

/* ---------- price and Daam ---------- */
view("priceAsk", function(){
  return K.head({})+ K.progress(88)+
  '<div class="pad" style="padding-top:12px">'+
    '<div class="msg"><img class="av" src="'+KIMG.kalaDisc+'" alt=""><div class="bub">'+
      '<div class="lead">'+esc(t("qPrice"))+'</div>'+(te("qPrice")?'<div class="sub">'+esc(te("qPrice"))+'</div>':'')+'</div></div>'+
    '<div class="card wash" style="margin:18px 0;display:flex;align-items:center;gap:10px;padding:20px">'+
      '<span style="font-size:28px;font-weight:700;color:var(--muted)">\u20B9</span>'+
      '<input class="field" id="priceIn" inputmode="numeric" placeholder="0" style="border:0;background:transparent;font-size:28px;font-weight:700;padding:0">'+
    '</div>'+
    '<p class="lede" style="font-size:16px">'+esc(t("needPriceHelp"))+'</p>'+
    '<div class="stack" style="margin-top:18px">'+
      '<button class="cta" data-act="askDaam" style="background:var(--gold);color:#3B2A00">'+ic("money",21,"#3B2A00")+esc(t("askKalaPrice"))+'</button>'+
      '<button class="cta hollow" data-act="ownPrice">'+esc(t("iKnowPrice"))+'</button>'+
    '</div>'+
  '</div>';
});
after("priceAsk", function(){ setTimeout(function(){ Voice.speak(t("qPrice")+" "+t("needPriceHelp")); }, 250); });
act("ownPrice", function(){
  var v = parseInt(document.getElementById("priceIn").value, 10);
  if (!v){ toast(t("qPrice")); return; }
  draft.price = v; go("publishNow");
});
act("askDaam", function(){ go("daam"); });

view("daam", function(){
  return K.head({})+
  '<div class="pad center" style="padding-top:24px">'+
    '<img class="orb live" src="'+KIMG.kalaFull+'" style="width:76px;height:76px" alt="">'+
    '<div class="title" style="margin-top:18px;font-size:22px">'+esc(t("kalaChecks"))+'</div>'+

    '<div id="daamOut" style="margin-top:24px;text-align:left"></div>'+
  '</div>';
});
after("daam", function(){
  Voice.speak(t("kalaChecks"));
  var lines = ["dMaterial","dTime","dSkill","dProfit"], out = document.getElementById("daamOut");
  out.innerHTML = '<div class="label">'+esc(t("daamConsider"))+'</div><div class="stack" id="dl" style="gap:11px"></div>';
  var dl = document.getElementById("dl"), i = 0;
  var iv = setInterval(function(){
    if (i >= lines.length){ clearInterval(iv); computePrice(); return; }
    var d = document.createElement("div"); d.className = "row";
    d.innerHTML = ic("check",18,"#2E7D4F",2.7)+'<span style="font-size:16.5px;font-weight:600">'+esc(t(lines[i]))+'</span>';
    dl.appendChild(d); i++;
  }, 500);
});
function computePrice(){
  var fb = Math.round(((draft.priceLow||2500) + (draft.priceHigh||6000)) / 2 / 100) * 100;
  var show = function(p, why){
    draft.suggested = p;
    var out = document.getElementById("daamOut"); if (!out) return;
    out.insertAdjacentHTML("beforeend",
      '<div class="card wash center" style="margin-top:22px;background:var(--gold-soft)">'+
        '<div class="label" style="margin-bottom:4px">'+esc(t("suggestedPrice"))+'</div>'+
        '<div class="big" style="font-size:40px">'+money(p)+'</div>'+
        (why ? '<p class="small" style="margin-top:8px">'+esc(why)+'</p>' : "")+
      '</div>'+
      '<p class="lede" style="font-size:15.5px">'+esc(t("priceYours"))+'</p>'+
      '<div class="stack" style="margin-top:18px;padding-bottom:28px">'+
        '<button class="cta" data-act="useSuggested">'+esc(t("usePrice"))+'</button>'+
        '<button class="cta hollow" data-act="changePrice">'+esc(t("change"))+'</button>'+
      '</div>');
    K.bind(out);
    Voice.speak(t("suggestedPrice")+" "+p+" "+L2("rupees","रुपये","रुपये")+". "+t("priceYours"));
  };
  if (!Kala.live()){ show(fb, ""); return; }
  Kala.json({system:"You are Daam, the fair-pricing helper in Karagir. Suggest ONE retail price in Indian rupees for this "+
    "handmade piece from materials, hours of work, skill and a fair margin for the artisan. Indian market, direct to buyer. "+
    "Round to the nearest 100. Return ONLY JSON: {\"price\": number, \"why\": <one short sentence in "+K.langName()+">}",
    max:300, messages:[{role:"user", content: JSON.stringify({craft:S.profile.craft, place:S.profile.place,
      years:S.profile.years, name:draft.name, size:draft.size, time:draft.time,
      materials:draft.materials, story:draft.story})}]})
    .then(function(r){ show(Math.round((r.price||fb)/100)*100, r.why||""); })
    .catch(function(){ show(fb, ""); });
}
act("useSuggested", function(){ draft.price = draft.suggested; go("publishNow"); });
act("changePrice", function(){
  K.sheet('<div class="ask" style="font-size:20px">'+esc(t("qPrice"))+'</div>'+
    '<input class="field" id="cp" inputmode="numeric" value="'+(draft.suggested||"")+'" style="margin-top:14px;font-size:26px;font-weight:700">'+
    '<button class="cta" data-act="cpSave" style="margin-top:18px">'+esc(t("save"))+'</button>');
});
act("cpSave", function(){
  var v = parseInt(document.getElementById("cp").value,10);
  if (v){ draft.price = v; K.closeSheet(); go("publishNow"); }
});

/* ---------- availability and publish ---------- */
view("publishNow", function(){
  return K.head({})+ K.progress(95)+
  '<div class="pad" style="padding-top:12px">'+
    '<div class="msg"><img class="av" src="'+KIMG.kalaDisc+'" alt=""><div class="bub">'+
      '<div class="lead">'+esc(t("qAvail"))+'</div></div></div>'+
    '<div class="stack" style="margin-top:16px">'+
      ["ready","order","no"].map(function(k){
        var lbl = k==="ready"?t("aReady"):k==="order"?t("onOrder"):t("notAvail");
        return '<button class="opt" aria-checked="'+(draft.avail===k)+'" data-act="setAvail" data-arg="'+k+'" style="min-height:64px">'+
          '<span class="txt"><b>'+esc(lbl)+'</b></span>'+
          '<span class="mark">'+(draft.avail===k?ic("check",13,"#fff",3.2):"")+'</span></button>'; }).join("")+
    '</div>'+
    '<div class="card wash" style="margin-top:22px;display:flex;align-items:center;gap:14px">'+
      '<img src="'+draft.photo+'" alt="" style="width:60px;height:60px;border-radius:12px;object-fit:cover">'+
      '<div style="flex:1"><b style="font-size:16.5px">'+esc(draft.name)+'</b>'+
      '<div class="big" style="font-size:23px;margin-top:2px">'+money(draft.price)+'</div></div>'+
    '</div>'+
  '</div>'+
  '<div class="foot"><button class="cta" data-act="doPublish">'+esc(t("publish"))+'</button></div>';
});
after("publishNow", function(){ setTimeout(function(){ Voice.speak(t("qAvail")); }, 240); });
act("setAvail", function(k){ draft.avail = k; K.rerender(); });
act("doPublish", function(){
  draft.published = true;
  draft.publishedAt = Date.now();
  var ix = S.items.findIndex(function(x){ return x.id === draft.id; });
  if (ix >= 0) S.items[ix] = draft; else S.items.unshift(draft);
  save(); log("publish", draft.name);
  go("live", null, true);
});

})();
</script>
<script>
/* ============================================================
   KARAGIR v2 — publish, share, work, money, profile, orders, settings
   ============================================================ */
(function(){
"use strict";
var K = window.KG, S = K.S, t = K.t, te = K.te, esc = K.esc, ic = K.ic;
var go = K.go, view = K.view, after = K.after, act = K.act, save = K.save, log = K.log;
var Voice = K.Voice, Kala = K.Kala, toast = K.toast, money = K.money, L2 = K.L2n;
function draft(){ return K.getDraft(); }

/* ============================================================
   LIVE + RANG
   ============================================================ */
var POST = null, POSTIMG = null;
view("live", function(){
  var d = draft();
  return '<div class="pad center" style="padding-top:calc(var(--st) + 30px)">'+
    '<div style="width:66px;height:66px;border-radius:50%;background:var(--ok-soft);margin:0 auto;display:grid;place-items:center">'+
      ic("check",34,"#2E7D4F",3)+'</div>'+
    '<div class="title" style="margin-top:18px">'+esc(t("published"))+'</div>'+
    '<div class="card wash" style="margin-top:20px;display:flex;align-items:center;gap:14px;text-align:left">'+
      '<img src="'+d.photo+'" alt="" style="width:60px;height:60px;border-radius:12px;object-fit:cover">'+
      '<div style="flex:1"><b style="font-size:16.5px">'+esc(d.name)+'</b>'+
      '<div class="big" style="font-size:22px">'+money(d.price)+'</div></div>'+
      '<span class="pill tag ok" style="font-size:11.5px">'+esc(t("live"))+'</span>'+
    '</div>'+
    '<div id="rangBox" style="margin-top:26px;text-align:left"></div>'+
    '<button class="cta text" data-act="nav" data-arg="home" style="margin:16px 0 28px">'+esc(t("navHome"))+'</button>'+
  '</div>';
});
after("live", function(){
  Voice.speak(t("published"));
  var box = document.getElementById("rangBox");
  box.innerHTML = '<div class="center"><div class="spin"></div><p class="small" style="margin-top:10px">'+esc(t("thinking"))+'</p></div>';
  caption(draft()).then(function(c){ POST = c; paintPost(box, c); })
    .catch(function(){ POST = fallbackCaption(draft()); paintPost(box, POST); });
});
function fallbackCaption(d){
  var tags = [S.profile.craft, S.profile.place, "handmade", "karagir"].filter(Boolean)
    .map(function(s){ return "#"+String(s).replace(/[^\p{L}\p{N}]/gu,""); }).join(" ");
  var body = L2(
    d.name+" — a handmade "+(S.profile.craft||"craft")+" piece by "+S.profile.name+" from "+(S.profile.place||"India")+". "+(d.story||"")+" "+money(d.price)+".",
    d.name+" — "+(S.profile.place||"")+" येथील "+S.profile.name+" यांनी हाताने बनवलेली "+(S.profile.craft||"कलाकृती")+". "+(d.story||"")+" "+money(d.price)+".",
    d.name+" — "+(S.profile.place||"")+" के "+S.profile.name+" द्वारा हाथ से बनाई "+(S.profile.craft||"कलाकृति")+". "+(d.story||"")+" "+money(d.price)+".");
  return {caption: body+"\n\n"+tags, caption_en: d.nameEn+" — handmade by "+S.profile.name+". "+money(d.price)+"\n\n"+tags};
}
function caption(d){
  if (!Kala.live()) return Promise.reject();
  return Kala.json({system:"You are Rang, the social helper in Karagir. Write ONE short post caption for a handmade craft, "+
    "for Instagram and WhatsApp Status. Warm and human, first person as the artisan, 2-3 short lines, then 5 to 7 hashtags on a new line. "+
    "No emoji. Use only the facts given. Return ONLY JSON: {\"caption\": <in "+K.langName()+", hashtags in English>, \"caption_en\": <English>}",
    max:500, messages:[{role:"user", content: JSON.stringify({artisan:S.profile.name, place:S.profile.place,
      craft:S.profile.craft, piece:d.name, story:d.story, size:d.size, materials:d.materials, price:d.price})}]});
}
function paintPost(box, c){
  var d = draft(); POSTIMG = d.photo;
  box.innerHTML =
    '<div class="row" style="margin-bottom:14px"><img src="'+KIMG.kalaDisc+'" alt="" style="width:32px;height:32px;border-radius:50%">'+
      '<div><b style="font-size:16.5px">'+esc(t("kalaMadePost"))+'</b>'+
        '<div class="small">'+esc(t("rangSub"))+'</div></div></div>'+
    '<div class="postcard"><div style="position:relative"><img id="postImg" src="'+d.photo+'" alt="">'+
      '<span class="wm">karagir</span></div><div class="cap" id="capText">'+esc(c.caption)+'</div></div>'+
    ((d.photos && d.photos.length > 1) ?
      '<p class="small" style="margin:14px 0 8px">'+esc(L2("Choose the photo for the post","पोस्टसाठी फोटो निवडा","पोस्ट के लिए फोटो चुनिए"))+'</p>'+
      '<div class="strip">'+d.photos.map(function(p,i){
        return '<button data-act="pickPostImg" data-arg="'+i+'" style="flex:none">'+
          '<img src="'+p+'" alt="" style="width:68px;height:68px;border-radius:12px;object-fit:cover"></button>'; }).join("")+'</div>' : "")+
    '<div class="stack" style="margin-top:16px">'+
      '<button class="cta" data-act="sharePost">'+ic("share",20,"#fff")+esc(t("shareNow"))+'</button>'+
      '<div class="pair">'+
        '<button class="cta hollow" data-act="shareWA">'+ic("wa",19)+esc(t("shareWA"))+'</button>'+
        '<button class="cta hollow" data-act="copyCap">'+esc(t("copyCaption"))+'</button>'+
      '</div>'+
      '<button class="cta text" data-act="editCap">'+ic("pencil",17)+esc(t("edit"))+'</button>'+
    '</div>'+
    '<div class="card wash" style="margin-top:14px">'+
      '<label class="row" style="cursor:pointer"><input type="checkbox" id="autoPost" '+(S.cfg.autoPost?"checked":"")+
        ' style="width:24px;height:24px;accent-color:#6F0004">'+
        '<span style="flex:1;font-size:15.5px;font-weight:600">'+esc(t("autoPost"))+'</span></label>'+
      '<div class="small" style="margin-top:10px">'+esc(t("postedTo"))+': WhatsApp Status · Instagram · Facebook</div>'+
    '</div>';
  K.bind(box);
  var ap = document.getElementById("autoPost");
  if (ap) ap.onchange = function(){ S.cfg.autoPost = ap.checked; save(); log("autopost", ap.checked); if (ap.checked) toast(t("autoOn")); };
  Voice.speak(t("kalaMadePost")+". "+t("rangSub"));
}
act("pickPostImg", function(i){ POSTIMG = draft().photos[+i]; document.getElementById("postImg").src = POSTIMG; });
act("editCap", function(){
  K.sheet('<div class="ask" style="font-size:20px">'+esc(t("edit"))+'</div>'+
    '<textarea class="field" id="capEdit" style="margin-top:14px;min-height:170px">'+esc(POST.caption)+'</textarea>'+
    '<button class="cta" data-act="capSave" style="margin-top:18px">'+esc(t("save"))+'</button>');
});
act("capSave", function(){
  POST.caption = document.getElementById("capEdit").value;
  document.getElementById("capText").textContent = POST.caption; K.closeSheet();
});
act("copyCap", function(){ navigator.clipboard && navigator.clipboard.writeText(POST.caption); toast(t("copied")); });
function toFile(durl, name){
  var m = durl.match(/^data:(.+?);base64,(.*)$/); if (!m) return null;
  var bin = atob(m[2]), arr = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new File([arr], name, {type:m[1]});
}
act("sharePost", function(){
  log("share_attempt");
  var f = toFile(POSTIMG || draft().photo, "karagir.jpg");
  var payload = {title: draft().name, text: POST.caption};
  if (f && navigator.canShare && navigator.canShare({files:[f]})) payload.files = [f];
  if (navigator.share) navigator.share(payload).then(function(){ log("share_ok"); toast(t("sent")); })
    .catch(function(e){ log("share_cancel", String(e).slice(0,50)); });
  else { navigator.clipboard && navigator.clipboard.writeText(POST.caption); toast(t("copied")); }
});
act("shareWA", function(){ window.open("https://wa.me/?text="+encodeURIComponent(POST.caption), "_blank"); });


/* ============================================================
   PRODUCT CARD
   ============================================================ */
K.productCard = function(it){
  var flags = [];
  if (it.custom && it.custom.on) flags.push(esc(t("customOn")));
  if (it.size) flags.push(esc(it.size));
  return '<button class="pcard" data-act="openItem" data-arg="'+it.id+'">'+
    '<span class="pimg"><img src="'+it.photo+'" alt="">'+
      '<span class="pflag'+(it.published?" ok":"")+'">'+
        esc(it.published ? t("live") : L2("Finish","पूर्ण करा","पूरा करें"))+'</span>'+
      ((it.photos && it.photos.length > 1) ?
        '<span class="pflag" style="left:auto;right:8px;background:rgba(16,24,40,.72);color:#fff">'+
          it.photos.length+'</span>' : '')+
    '</span>'+
    '<span class="pbody">'+
      '<b class="pname">'+esc(it.name)+'</b>'+
      '<span class="pprice">'+(it.price ? money(it.price) : "—")+'</span>'+
      '<span class="pmeta">'+esc([it.time, (it.materials||[])[0]].filter(Boolean).join(" · "))+'</span>'+
      (flags.length ? '<span class="ptags">'+flags.map(function(f){ return '<span>'+f+'</span>'; }).join("")+'</span>' : '')+
    '</span></button>';
};

/* ============================================================
   PRODUCT DETAIL
   ============================================================ */
view("item", function(a){
  var it = S.items.filter(function(x){ return x.id === a.id; })[0];
  if (!it) return '<div class="pad">—</div>';
  K.setDraft(it);
  it.custom = it.custom || {on:false, opts:[]};
  var ph = it.photos && it.photos.length ? it.photos : [it.photo];
  var p = S.profile, tr = K.tribeById(p.tribe);
  var lore = (K.tribeLore && p.tribe) ? K.tribeLore[p.tribe] : null;
  function loreP(o){ return o ? (o[K.L()] || o.en) : ""; }

  return K.head({title:t("buyersSee")})+
  '<div class="pad" style="padding-top:2px">'+
    '<img src="'+it.photo+'" class="photo" alt="">'+
    (ph.length > 1 ? K.photoStrip(ph, {onRemove:"drRemove", onAdd:"drAdd"})
                   : '<div style="margin-top:12px">'+K.photoStrip(ph, {onAdd:"drAdd"})+'</div>')+

    '<div class="title" style="margin-top:12px">'+esc(it.name)+'</div>'+
    (it.nameEn && it.nameEn !== it.name ? '<div class="gloss">'+esc(it.nameEn)+'</div>' : '')+
    '<div class="big" style="margin-top:8px">'+(it.price ? money(it.price) : "—")+'</div>'+
    '<div class="pills" style="margin-top:10px">'+
      '<span class="pill tag '+(it.published?"ok":"gold")+'">'+
        esc(it.published ? t("live") : L2("Not live yet","अजून विक्रीसाठी नाही","अभी बिक्री पर नहीं"))+'</span>'+
      (it.avail === "order" ? '<span class="pill tag">'+esc(t("onOrder"))+'</span>' : '')+
    '</div>'+
    (it.story ? '<p style="font-size:16.5px;line-height:1.62;margin-top:14px">'+esc(it.story)+'</p>' : '')+
    '<div class="pills" style="margin-top:14px">'+
      (it.size?'<span class="pill tag">'+ic("ruler",14)+' '+esc(it.size)+'</span>':'')+
      (it.time?'<span class="pill tag">'+ic("clock",14)+' '+esc(it.time)+'</span>':'')+
      (it.materials||[]).map(function(m){ return '<span class="pill tag">'+esc(m)+'</span>'; }).join("")+
    '</div>'+
    '<button class="cta text" data-act="sayListing" style="margin-top:6px;padding-left:0">'+
      ic("speak",17)+esc(t("listen"))+'</button>'+

    /* who made it */
    '<div class="sect"><div class="sect-h"><h3>'+esc(t("madeBy"))+'</h3></div>'+
      '<button class="listrow" data-act="openProfile" style="text-align:left">'+
        '<span style="position:relative;flex:none">'+
          (p.photo ? '<img src="'+p.photo+'" alt="" style="width:52px;height:52px;border-radius:50%;object-fit:cover">'
                   : '<span class="th" style="border-radius:50%;display:grid;place-items:center">'+ic("user",22,"#6F0004")+'</span>')+
          (tr ? '<img src="'+KTRIBE[tr.id]+'" alt="" style="position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 2px var(--paper)">' : '')+
        '</span>'+
        '<span class="mid"><b>'+esc(p.name||"")+'</b><span>'+
          esc([(p.district?K.dName(p.district):p.place), tr?K.tribeName(tr):""].filter(Boolean).join(" · "))+'</span></span>'+
        ic("chev",19,"#9AA1AC")+'</button>'+
      (p.story ? '<p style="font-size:15.5px;line-height:1.6;margin-top:12px;color:var(--muted)">'+esc(p.story)+'</p>' : '')+
    '</div>'+

    /* the art form this piece belongs to */
    (tr ? '<div class="sect"><div class="sect-h"><h3>'+esc(t("aboutArt"))+'</h3></div>'+
      '<div class="card wash">'+
        '<div class="row"><img src="'+KTRIBE[tr.id]+'" alt="" style="width:48px;height:48px;flex:none">'+
          '<div style="flex:1"><b style="font-size:17px">'+esc(K.tribeName(tr))+'</b>'+
          '<div class="small">'+esc(loreP(lore && lore.where))+'</div></div></div>'+
        (lore ? '<p style="font-size:15.5px;line-height:1.6;margin-top:12px">'+esc(loreP(lore.craft))+'</p>' : '')+
        (lore ? '<div class="pills" style="margin-top:12px">'+(loreP(lore.tags)||[]).map(function(x){
          return '<span class="pill tag" style="background:var(--paper)">'+esc(x)+'</span>'; }).join("")+'</div>' : '')+

function historyFor(it){
  var out = [], d = function(ms){ return new Date(ms).toLocaleDateString(); };
  out.push({what:t("hAdded"), when:d(it.created || Date.now())});
  if (it.published) out.push({what:t("hPublished"), when:d(it.publishedAt || it.created || Date.now())});
  (S.posts||[]).filter(function(p){ return p.id === it.id; }).forEach(function(p){
    out.push({what:t("hPosted"), when:d(p.when)+" · "+(p.channels||[]).length+" "+L2("places","ठिकाणी","जगह")});
  });
  (S.orders||[]).filter(function(o){ return o.item === it.name; }).forEach(function(o){
    out.push({what:t("hEnquiry")+" — "+o.from, when:d(o.when)});
  });
  return out;
}

after("kalaChat", function(){
  paintKC(); K.wireMic(kcSend);
  if (KC.length) return;
  if (KCSEED){
    var seed = KCSEED; KCSEED = null;
    kcSend(seed.q, seed.fallback);
    return;
  }
  var hi = L2("Yes? Tell me what you need.","बोला, मी ऐकते आहे.","बोलिए, मैं सुन रही हूँ.");
  KC.push({who:"kala", text:hi}); paintKC(); K.kalaSay(hi);
});
function paintKC(){
  var w = document.getElementById("kcw"); if (!w) return;
  w.innerHTML = KC.map(function(m,i){
    if (m.who === "me") return '<div class="msg mine"><div class="bub"><div class="lead">'+esc(m.text)+'</div></div></div>';
    if (m.typing) return '<div class="msg"><img class="av" src="'+KIMG.kalaDisc+'" alt=""><div class="bub"><div class="dots"><i></i><i></i><i></i></div></div></div>';
    return '<div class="msg"><img class="av" src="'+KIMG.kalaDisc+'" alt=""><div class="bub"><div class="lead">'+esc(m.text)+'</div>'+
      '<button class="hear" data-act="kcReplay" data-arg="'+i+'">'+ic("speak",14)+esc(t("listen"))+'</button></div></div>';
  }).join("");
  K.bind(w);
  var sc = document.getElementById("screen"); sc.scrollTop = sc.scrollHeight;
}
act("kcReplay", function(i){ Voice.speak(KC[+i].text); });
function kcSend(txt, fallback){
  KC.push({who:"me", text:txt}); paintKC();
  if (!Kala.live()){
    var f = fallback || L2("I have noted that. You can add a product or check your orders from the home screen.",
               "मी नोंद घेतली. तुम्ही घरच्या पानावरून वस्तू जोडू शकता किंवा ऑर्डर पाहू शकता.",
               "मैंने नोट कर लिया. आप घर के पन्ने से चीज़ जोड़ सकते हैं या ऑर्डर देख सकते हैं.");
    KC.push({who:"kala", text:f}); paintKC(); K.kalaSay(f); return;
  }
  KC.push({who:"kala", typing:true}); paintKC(); K.setMic("busy");
  var hist = KC.filter(function(m){ return !m.typing; }).slice(-8).map(function(m){
    return {role: m.who === "me" ? "user" : "assistant", content: m.text}; });
  Kala.call({system:"You are Kala, the assistant inside Karagir, used by Indian artisans with little formal literacy. "+
      "Answer in "+K.langName()+", in at most three short spoken sentences. Plain words, no lists, no emoji, no jargon. "+
      "You help with adding a product, pricing (Daam), writing a story, replying to customers, social posts (Rang) and earnings (Hisab). "+
      "The artisan is "+(S.profile.name||"")+", "+(S.profile.craft||"")+" from "+(S.profile.place||"")+".",
    max:400, messages:hist})
    .then(function(x){ KC = KC.filter(function(m){ return !m.typing; }); KC.push({who:"kala", text:x}); paintKC(); K.kalaSay(x); })
    .catch(function(){ KC = KC.filter(function(m){ return !m.typing; });
      var f = fallback || L2("I could not reach the network.","नेटवर्क मिळालं नाही.","नेटवर्क नहीं मिला.");
      KC.push({who:"kala", text:f}); paintKC(); K.kalaSay(f); });
}

function tribeName(tr){ return tr[K.L()] || tr.en; }
function tribeById(id){ for (var i=0;i<TRIBES.length;i++) if (TRIBES[i].id === id) return TRIBES[i]; return null; }
K.TRIBES = TRIBES; K.tribeById = tribeById; K.tribeName = tribeName;

/* a badge: the medallion at whatever size, optionally with the name beside it */
K.tribeBadge = function(id, size, withName){
  var tr = tribeById(id); if (!tr) return "";
  var img = '<img src="'+KTRIBE[id]+'" alt="'+esc(tribeName(tr))+'" style="width:'+size+'px;height:'+size+'px;flex:none">';
  if (!withName) return img;
  return '<span class="row" style="gap:8px;display:inline-flex;align-items:center">'+img+
    '<span style="font-size:14px;font-weight:700">'+esc(tribeName(tr))+'</span></span>';
};

/* pick the tribe from spoken words, so "मी वारली आहे" still lands */
K.matchTribe = function(text){
  var s = String(text||"").toLowerCase();
  for (var i=0;i<TRIBES.length;i++){
    var tr = TRIBES[i];
    if (s.indexOf(tr.mr.toLowerCase()) >= 0 || s.indexOf(tr.hi.toLowerCase()) >= 0 ||
        s.indexOf(tr.en.toLowerCase()) >= 0) return tr;
  }
  return null;
};

/* the medallion grid, used inside the conversation */
K.tribeGrid = function(){
  return '<div class="tribegrid">'+ TRIBES.map(function(tr){
      return '<button class="tribe" data-act="pickTribe" data-arg="'+tr.id+'" '+
        'aria-pressed="'+(S.profile.tribe===tr.id)+'">'+
        '<img src="'+KTRIBE[tr.id]+'" alt="">'+
        '<span>'+esc(tribeName(tr))+'</span></button>'; }).join("")+'</div>';
};

/* ============================================================
   DISTRICTS
   ============================================================ */
var DNAMES = {
  Palghar:{mr:"पालघर",hi:"पालघर"}, Thane:{mr:"ठाणे",hi:"ठाणे"}, Nashik:{mr:"नाशिक",hi:"नासिक"},
  Pune:{mr:"पुणे",hi:"पुणे"}, Raigad:{mr:"रायगड",hi:"रायगढ़"}, Ratnagiri:{mr:"रत्नागिरी",hi:"रत्नागिरी"},
  Sindhudurg:{mr:"सिंधुदुर्ग",hi:"सिंधुदुर्ग"}, Ahmednagar:{mr:"अहमदनगर",hi:"अहमदनगर"},
  Nandurbar:{mr:"नंदुरबार",hi:"नंदुरबार"}, Dhule:{mr:"धुळे",hi:"धुले"}, Jalgaon:{mr:"जळगाव",hi:"जलगाँव"},
  Amravati:{mr:"अमरावती",hi:"अमरावती"}, Buldhana:{mr:"बुलढाणा",hi:"बुलढाणा"}, Akola:{mr:"अकोला",hi:"अकोला"},
  Washim:{mr:"वाशिम",hi:"वाशिम"}, Yavatmal:{mr:"यवतमाळ",hi:"यवतमाल"}, Nagpur:{mr:"नागपूर",hi:"नागपुर"},
  Wardha:{mr:"वर्धा",hi:"वर्धा"}, Bhandara:{mr:"भंडारा",hi:"भंडारा"}, Gondia:{mr:"गोंदिया",hi:"गोंदिया"},
  Chandrapur:{mr:"चंद्रपूर",hi:"चंद्रपुर"}, Gadchiroli:{mr:"गडचिरोली",hi:"गढ़चिरौली"},
  Nanded:{mr:"नांदेड",hi:"नांदेड़"}, Hingoli:{mr:"हिंगोली",hi:"हिंगोली"}, Parbhani:{mr:"परभणी",hi:"परभणी"},
  Jalna:{mr:"जालना",hi:"जालना"}, Aurangabad:{mr:"छत्रपती संभाजीनगर",hi:"संभाजीनगर"},
  Beed:{mr:"बीड",hi:"बीड"}, Latur:{mr:"लातूर",hi:"लातूर"}, Osmanabad:{mr:"धाराशिव",hi:"धाराशिव"},
  Solapur:{mr:"सोलापूर",hi:"सोलापुर"}, Satara:{mr:"सातारा",hi:"सातारा"}, Sangli:{mr:"सांगली",hi:"सांगली"},
  Kolhapur:{mr:"कोल्हापूर",hi:"कोल्हापुर"}, Mumbai:{mr:"मुंबई",hi:"मुंबई"}
};
function dName(d){ var n = DNAMES[d]; return (n && n[K.L()]) || d; }
K.dName = dName;

/* work out the district from whatever they said their place was */
K.guessDistrict = function(place){
  var s = String(place||"").toLowerCase().trim();
  if (!s) return null;
  var keys = Object.keys(KMAP.c);
  for (var i=0;i<keys.length;i++){
    var d = keys[i], n = DNAMES[d] || {};
    if (s.indexOf(d.toLowerCase()) >= 0) return d;
    if (n.mr && s.indexOf(n.mr) >= 0) return d;
    if (n.hi && s.indexOf(n.hi) >= 0) return d;
  }
  return null;
};

/* other artisans already on the map — seeded so the map is never empty */
var PEERS = [
  {d:"Gadchiroli", tribe:"gond",    name:"Sushila"},
  {d:"Nandurbar",  tribe:"bhil",    name:"Ramji"},
  {d:"Amravati",   tribe:"korku",   name:"Devidas"},
  {d:"Raigad",     tribe:"katkari", name:"Sakhu"},
  {d:"Yavatmal",   tribe:"kolam",   name:"Pandu"},
  {d:"Ahmednagar", tribe:"koli",    name:"Ganpat"},
  {d:"Chandrapur", tribe:"madia",   name:"Lakhma"},
  {d:"Thane",      tribe:"thakar",  name:"Vithal"}
];
K.PEERS = PEERS;

/* ============================================================
   THE MAP
   ============================================================ */
function mapSVG(opts){
  opts = opts || {};
  var mine = opts.district, tr = tribeById(opts.tribeId || S.profile.tribe);
  var home = tr ? tr.dist : [];
  var paths = Object.keys(KMAP.d).map(function(d){
    var isHome = home.indexOf(d) >= 0, isMine = d === mine;
    var fill = isMine ? "#6F0004" : (isHome ? "#E9DFC6" : "#EFEEE8");
    return '<path d="'+KMAP.d[d]+'" fill="'+fill+'" stroke="#FFFFFF" stroke-width="1"'+
      (opts.pick ? ' data-act="pickDistrict" data-arg="'+d+'" style="cursor:pointer"' : '')+'/>';
  }).join("");

  var pins = "";
  if (opts.peers !== false){
    pins += PEERS.map(function(p){
      var c = KMAP.c[p.d]; if (!c) return "";
      return '<image href="'+KTRIBE[p.tribe]+'" x="'+(c[0]-11)+'" y="'+(c[1]-11)+'" width="26" height="26" opacity="0.92"/>';
    }).join("");
  }
  if (mine && KMAP.c[mine]){
    var c = KMAP.c[mine], r = 36;
    pins += '<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+(r/2+7)+'" fill="none" stroke="#6F0004" stroke-width="2" opacity=".55">'+
      '<animate attributeName="r" values="'+(r/2+5)+';'+(r/2+16)+'" dur="2.2s" repeatCount="indefinite"/>'+
      '<animate attributeName="opacity" values=".55;0" dur="2.2s" repeatCount="indefinite"/></circle>';
    pins += '<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+(r/2+3)+'" fill="#FFFFFF"/>';
    pins += S.profile.tribe
      ? '<image href="'+KTRIBE[S.profile.tribe]+'" x="'+(c[0]-r/2)+'" y="'+(c[1]-r/2)+'" width="'+r+'" height="'+r+'"/>'
      : '<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+(r/2-2)+'" fill="#6F0004"/>';
  }
  return '<svg viewBox="0 0 '+KMAP.w+' '+KMAP.h+'" width="100%" style="display:block">'+paths+
    '<g style="pointer-events:none">'+pins+'</g></svg>';
}
K.mapSVG = mapSVG;

var pickDist = null;
view("mapPlace", function(){
  if (!pickDist) pickDist = S.profile.district || K.guessDistrict(S.profile.place) || "Palghar";
  var tr = tribeById(S.profile.tribe);
  return K.head({})+ K.progress(98)+
  '<div class="pad" style="padding-top:10px">'+
    '<div class="title">'+esc(t("mapTitle"))+'</div>'+
    (te("mapTitle")?'<div class="gloss">'+esc(te("mapTitle"))+'</div>':'')+
    '<p class="lede" style="font-size:16px">'+esc(t("mapBody"))+'</p>'+
    '<div class="mapwrap" id="mapwrap">'+ mapSVG({district:pickDist, pick:true}) +'</div>'+
    '<div class="card wash" style="margin-top:14px;display:flex;align-items:center;gap:13px">'+
      (tr ? '<img src="'+KTRIBE[tr.id]+'" alt="" style="width:46px;height:46px;flex:none">'
          : '<span style="width:46px;height:46px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none">'+ic("home",21,"#6F0004")+'</span>')+
      '<div style="flex:1"><b style="font-size:18px">'+esc(dName(pickDist))+'</b>'+
        (tr ? '<div class="small">'+esc(tribeName(tr))+'</div>' : '')+'</div>'+
    '</div>'+
    '<p class="small" style="margin-top:10px">'+esc(t("mapTapHint"))+'</p>'+
    '<button class="cta text" data-act="districtList" style="margin-top:2px">'+esc(t("districtList"))+'</button>'+
  '</div>'+
  '<div class="foot"><div class="stack">'+
    '<button class="cta" data-act="mapConfirm">'+ic("check",21,"#fff",2.6)+esc(t("mapConfirm"))+'</button>'+
    '<button class="cta text" data-act="mapSkip">'+esc(t("skip"))+'</button>'+
  '</div></div>';
});
after("mapPlace", function(){
  setTimeout(function(){ Voice.speak(t("mapTitle")+". "+t("mapBody")+" "+dName(pickDist)+". "+t("mapTapHint")); }, 300);
  K.wireMic && null;
});
act("pickDistrict", function(d){
  pickDist = d; log("map_district", d);
  var w = document.getElementById("mapwrap");
  K.rerender();
  Voice.speak(dName(d));
});
act("districtList", function(){
  var ds = Object.keys(KMAP.c).sort(function(a,b){ return dName(a).localeCompare(dName(b)); });
  K.sheet('<div class="ask" style="font-size:20px">'+esc(t("districtList"))+'</div>'+
    '<div class="stack" style="margin-top:14px">'+ ds.map(function(d){
      return '<button class="listrow'+(d===pickDist?' wash':'')+'" data-act="pickDistrictRow" data-arg="'+d+'">'+
        '<span class="mid"><b>'+esc(dName(d))+'</b>'+(dName(d)!==d?'<span>'+esc(d)+'</span>':'')+'</span>'+
        (d===pickDist ? ic("check",19,"#6F0004",2.7) : ic("chev",19,"#9AA1AC"))+'</button>'; }).join("")+'</div>');
});
act("pickDistrictRow", function(d){ K.closeSheet(); pickDist = d; log("map_district_list", d); K.rerender(); Voice.speak(dName(d)); });

act("mapConfirm", function(){
  S.profile.district = pickDist; save(); log("map_confirmed", pickDist);
  go("mapDone", null, true);
});
act("mapSkip", function(){ go("social", null, true); });

view("mapDone", function(){
  var tr = tribeById(S.profile.tribe);
  return '<div class="pad center" style="padding-top:calc(var(--st) + 26px)">'+
    '<div class="title">'+esc(t("mapDone"))+'</div>'+
    '<p class="lede">'+esc(t("mapDoneB"))+'</p>'+
    '<div class="mapwrap" style="margin-top:18px">'+ mapSVG({district:S.profile.district}) +'</div>'+
    '<div class="card" style="margin-top:16px;display:flex;align-items:center;gap:13px;text-align:left">'+
      (S.profile.photo ? '<img src="'+S.profile.photo+'" alt="" style="width:50px;height:50px;border-radius:50%;object-fit:cover">' : "")+
      '<div style="flex:1"><b style="font-size:17px">'+esc(S.profile.name||"")+'</b>'+
        '<div class="small">'+esc(dName(S.profile.district))+(tr ? " · "+esc(tribeName(tr)) : "")+'</div></div>'+
      (tr ? '<img src="'+KTRIBE[tr.id]+'" alt="" style="width:44px;height:44px;flex:none">' : "")+
    '</div>'+
  '</div>'+
  '<div class="foot"><button class="cta" data-act="toReadyFromMap">'+esc(t("continue"))+'</button></div>';
});
after("mapDone", function(){ Voice.speak(t("mapDone")+" "+t("mapDoneB")); });
act("toReadyFromMap", function(){ go("social", null, true); });

/* the map again later, from the profile */
view("mapView", function(){
  var tr = tribeById(S.profile.tribe);
  var near = PEERS.filter(function(p){ return tr && tr.dist.indexOf(p.d) >= 0; });
  return K.head({title:t("mapTitleShort")})+
  '<div class="pad" style="padding-top:4px">'+
    '<div class="mapwrap">'+ mapSVG({district:S.profile.district}) +'</div>'+
    '<div class="card wash" style="margin-top:14px;display:flex;align-items:center;gap:13px">'+
      (tr ? '<img src="'+KTRIBE[tr.id]+'" alt="" style="width:48px;height:48px;flex:none">' : "")+
      '<div style="flex:1"><b style="font-size:17px">'+esc(S.profile.name||"")+'</b>'+
      '<div class="small">'+esc(S.profile.district ? dName(S.profile.district) : (S.profile.place||""))+
        (tr ? " · "+esc(tribeName(tr)) : "")+'</div></div>'+
      '<button class="cta text sm" data-act="editMap">'+esc(t("change"))+'</button>'+
    '</div>'+
    '<div class="sect"><div class="sect-h"><h3>'+esc(t("otherArtisans"))+'</h3></div>'+
      '<div class="stack">'+ PEERS.map(function(p){
        var pt = tribeById(p.tribe);
        return '<div class="listrow"><img src="'+KTRIBE[p.tribe]+'" alt="" style="width:46px;height:46px;flex:none">'+
          '<span class="mid"><b>'+esc(p.name)+'</b><span>'+esc(dName(p.d))+' · '+esc(tribeName(pt))+'</span></span></div>'; }).join("")+
    '</div></div><div style="height:24px"></div>'+
  '</div>';
});
act("editMap", function(){ pickDist = S.profile.district; go("mapPlace"); });
act("openMap", function(){ go("mapView"); });

})();
</script>
<script>
/* ============================================================

(function(){

function P(o){ return o[K.L()] || o.en; }

/* ============================================================

var LORE = window.KG.tribeLore = {
warli: {
  where:{en:"Palghar, Thane and parts of Nashik, in the hills and coast of north Konkan.",

  craft:{en:"Warli painting began on the mud walls of homes, painted by women for weddings and harvests. White rice paste on a red earth ground, built from three shapes: the circle, the triangle and the square.",
         mr:"वारली चित्रकला घराच्या मातीच्या भिंतींवर सुरू झाली — लग्न आणि कापणीच्या वेळी स्त्रिया ती काढत. गेरूच्या भिंतीवर तांदळाच्या पिठाने, आणि तीनच आकारांतून: वर्तुळ, त्रिकोण आणि चौकोन.",

  more:{en:"The tarpa dance spirals outward from the centre of many paintings. Palghat, the goddess of marriage, sits inside the square chauk. From the 1970s the work moved from wall to paper and cloth, and reached buyers far beyond the villages.",
        mr:"अनेक चित्रांच्या मध्यभागातून तारपा नृत्याचा गोल फेर बाहेर उलगडत जातो. चौकात लग्नाची देवी पालघाट बसते. १९७० नंतर हे काम भिंतीवरून कागद आणि कापडावर आलं आणि गावाबाहेरच्या खरेदीदारांपर्यंत पोहोचलं.",

  tags:{en:["Rice paste on red earth","The tarpa dance","Circle, triangle, square","Wedding chauk"],
        mr:["गेरूवर तांदळाचा रंग","तारपा नृत्य","वर्तुळ, त्रिकोण, चौकोन","लग्नाचा चौक"],

gond: {

  craft:{en:"Gond life is carried in song, in the stories of the Pardhan bards, and in painting. Trees, deer, birds and rivers are drawn as one connected body.",
         mr:"गोंड जीवन गाण्यातून, पारधान गायकांच्या कथांतून आणि चित्रांतून पुढे जातं. झाडं, हरणं, पक्षी आणि नद्या एकाच जोडलेल्या देहासारखी काढली जातात.",

  more:{en:"The painted style widely known today grew from Patangarh in Madhya Pradesh, where Jangarh Singh Shyam filled his forms with rows of dots and dashes. Every artist keeps a signature fill of their own.",

  tags:{en:["Dot and dash fills","Tree of life","Pardhan song","Forest animals"],

view("communities", function(){
  return K.head({title:t("communities")})+
  '<div class="pad" style="padding-top:4px">'+
    '<p class="lede" style="margin-top:0">'+esc(t("communitiesB"))+'</p>'+
    '<div class="commgrid" style="margin-top:20px">'+ K.TRIBES.map(function(tr){
      var n = K.PEERS.filter(function(p){ return p.tribe === tr.id; }).length + (S.profile.tribe === tr.id ? 1 : 0);
      return '<button class="commcell" data-act="openTribe" data-arg="'+tr.id+'">'+
        '<img src="'+KTRIBE[tr.id]+'" alt=""><b>'+esc(K.tribeName(tr))+'</b>'+
        '<span>'+n+' '+esc(L2("artisans","कलाकार","कलाकार"))+'</span></button>'; }).join("")+
    '</div><div style="height:26px"></div>'+
  '</div>';
});
act("openTribe", function(id){ go("tribeStory", {id:id}); });

view("tribeStory", function(a){
  var tr = K.tribeById(a.id); if (!tr) return '<div class="pad">—</div>';
  var lore = LORE[tr.id] || {};
  var peers = K.PEERS.filter(function(p){ return p.tribe === tr.id; });
  var mine = S.profile.tribe === tr.id;
  function block(labelKey, body){
    return '<div class="sect"><div class="sect-h"><h3>'+esc(t(labelKey))+'</h3></div>'+
      '<p style="font-size:16.5px;line-height:1.65">'+esc(body)+'</p></div>';
  }
  return K.head({})+
  '<div class="pad" style="padding-top:4px">'+
    '<div class="hero">'+
      '<img class="medal" src="'+KTRIBE[tr.id]+'" alt="">'+
      '<div class="title" style="margin-top:14px">'+esc(K.tribeName(tr))+'</div>'+
      (K.L()!=="en" ? '<div class="gloss">'+esc(tr.en)+'</div>' : '')+
      (mine ? '<div class="pill tag mar" style="margin-top:12px;display:inline-flex">'+
        esc(L2("Your community","तुमचा समाज","आपका समुदाय"))+'</div>' : '')+
    '</div>'+
    '<div class="mapwrap">'+ K.mapSVG({district: mine ? S.profile.district : null, peers:false, tribeId:tr.id}) +'</div>'+
    '<p class="small" style="margin-top:8px">'+esc(P(lore.where||{en:""}))+'</p>'+
    block("tribeStory", P(lore.craft||{en:""}))+
    '<p style="font-size:16.5px;line-height:1.65;margin-top:12px">'+esc(P(lore.more||{en:""}))+'</p>'+
    '<div class="sect"><div class="sect-h"><h3>'+esc(t("knownFor"))+'</h3></div>'+
      '<div class="pills">'+(P(lore.tags||{en:[]})||[]).map(function(x){
        return '<span class="pill tag">'+esc(x)+'</span>'; }).join("")+'</div></div>'+
    (peers.length ? '<div class="sect"><div class="sect-h"><h3>'+esc(t("artisansFrom"))+'</h3></div>'+
      '<div class="stack">'+peers.map(function(p){
        return '<div class="listrow"><img src="'+KTRIBE[p.tribe]+'" alt="" style="width:44px;height:44px;flex:none">'+
          '<span class="mid"><b>'+esc(p.name)+'</b><span>'+esc(K.dName(p.d))+'</span></span></div>'; }).join("")+
      '</div></div>' : "")+
    '<div class="draftnote" style="margin-top:26px">'+esc(t("tribeDraft"))+'</div>'+
    '<button class="cta text" data-act="sayLore" data-arg="'+tr.id+'" style="margin-top:8px">'+ic("speak",17)+esc(t("listen"))+'</button>'+
    '<div style="height:24px"></div>'+
  '</div>';
});
after("tribeStory", function(a){
  var lore = LORE[a.id] || {};
  setTimeout(function(){ Voice.speak(P(lore.craft||{en:""})); }, 300);
});
act("sayLore", function(id){
  var l = LORE[id] || {};
  Voice.speak(P(l.where||{en:""})+" "+P(l.craft||{en:""})+" "+P(l.more||{en:""}));
});

var wdraft = null;
function whenChips(){
  return [{label:t("tomorrow")},{label:t("thisWeekend")},{label:t("nextWeek")},{label:t("nextMonth")}];
}
act("newWorkshop", function(){
  wdraft = {id:"w"+Date.now(), what:"", when:"", where:"", seats:8, fee:0, created:Date.now(), joined:0};
  askWhat();
});
function askWhat(){
  K.ask({pct:20, q:t("wsWhat"), qEn:te("wsWhat"), h:t("wsWhatH"),
    onAnswer:function(v){ wdraft.what = String(v).trim(); askWhen(); }});
}
function askWhen(){
  K.ask({pct:40, q:t("wsWhen"), qEn:te("wsWhen"), chips:whenChips(),
    onAnswer:function(v){ wdraft.when = String(v).trim(); askWhere(); }});
}
function askWhere(){
  K.ask({pct:60, q:t("wsWhere"), qEn:te("wsWhere"), h:t("wsWhereH"),
    chips:[{label:L2("At my home","माझ्या घरी","मेरे घर पर")},
           {label:L2("In my village","माझ्या गावात","मेरे गाँव में")}],
    onAnswer:function(v){ wdraft.where = String(v).trim(); askSeats(); }});
}
function askSeats(){
  K.ask({pct:78, q:t("wsSeats"), qEn:te("wsSeats"),
    chips:[{label:"5"},{label:"8"},{label:"10"},{label:"20"}],
    onAnswer:function(v){
      var n = parseInt(String(v).replace(/\D/g,""),10);
      wdraft.seats = n || 8; askFee(); }});
}
function askFee(){
  K.ask({pct:90, q:t("wsFee"), qEn:te("wsFee"),

  return K.head({title:reg.ev.host})+

after("orgChat", function(){
  paintOC(); K.wireMic(ocSend);
  if (OC.length === 1) K.kalaSay(OC[0].text);
});
function paintOC(){
  var w = document.getElementById("ocw"); if (!w) return;
  w.innerHTML = OC.map(function(m,i){
    if (m.who === "me") return '<div class="msg mine"><div class="bub"><div class="lead">'+esc(m.text)+'</div></div></div>';
    if (m.typing) return '<div class="msg"><span class="av" style="background:var(--wash);display:grid;place-items:center">'+
      ic("people",17,"#6F0004")+'</span><div class="bub"><div class="dots"><i></i><i></i><i></i></div></div></div>';
    return '<div class="msg"><span class="av" style="background:var(--wash);display:grid;place-items:center">'+
      ic("people",17,"#6F0004")+'</span><div class="bub"><div class="lead">'+esc(m.text)+'</div>'+
      '<button class="hear" data-act="ocSay" data-arg="'+i+'">'+ic("speak",14)+esc(t("listen"))+'</button></div></div>';
  }).join("");
  K.bind(w);
  var sc = document.getElementById("screen"); sc.scrollTop = sc.scrollHeight;
}
act("ocSay", function(i){ Voice.speak(OC[+i].text); });
function ocSend(txt){
  OC.push({who:"me", text:txt}); paintOC(); log("organiser_msg", txt.slice(0,60));
  OC.push({who:"org", typing:true}); paintOC(); K.setMic("busy");
  /* the organiser is a person, not a model: a plain scripted reply after a pause */
  setTimeout(function(){
    OC = OC.filter(function(m){ return !m.typing; });
    OC.push({who:"org", text:t("orgReply")}); paintOC(); K.kalaSay(t("orgReply"));
  }, 1400);
}

K.queuePost = function(p){
  S.posts = S.posts || [];
  var chans = S.cfg.channels || {wa:true, ig:true, fb:false};
  p.when = Date.now(); p.auto = !!S.cfg.autoPost;
  p.channels = Object.keys(chans).filter(function(c){ return chans[c]; });
  S.posts.unshift(p); save();
  if (S.cfg.autoPost) toast(t("autoOn"));
};
var CHAN = {wa:"WhatsApp Status", ig:"Instagram", fb:"Facebook"};

      '<span class="sw" aria-checked="'+(!!S.cfg.autoPost)+'"><i></i></span></button>'+
    '<div class="sect"><div class="sect-h"><h3>'+esc(t("channels"))+'</h3></div>'+
      '<div class="stack">'+Object.keys(CHAN).map(function(c){
        return '<button class="chanrow" data-act="toggleChan" data-arg="'+c+'">'+
          '<span style="width:40px;height:40px;border-radius:12px;background:var(--wash);display:grid;place-items:center;flex:none">'+
            ic(c==="wa"?"wa":c==="ig"?"image":"chat",19,"#6F0004")+'</span>'+
          '<span style="flex:1;font-size:16px;font-weight:600">'+CHAN[c]+'</span>'+

    '</div>'+

                   : '<span class="th" style="display:grid;place-items:center">'+ic("people",20,"#6F0004")+'</span>')+

            esc((p.channels||[]).map(function(c){ return CHAN[c]; }).join(" · ") || "—")+'</span></span>'+

            esc(p.auto ? L2("Auto","आपोआप","अपने आप") : L2("By hand","स्वतः","खुद"))+'</span></div>'; }).join("")+'</div>'

<script>
/* ============================================================
   KARAGIR v2 — the community section
   A coloured map of the nine communities, a feed, and the choice
   of posting to everyone or only to your own community.
   ============================================================ */
(function(){
"use strict";
var K = window.KG, S = K.S, t = K.t, te = K.te, esc = K.esc, ic = K.ic;
var go = K.go, view = K.view, after = K.after, act = K.act, save = K.save, log = K.log;
var Voice = K.Voice, Kala = K.Kala, toast = K.toast, L2 = K.L2n;
function P(o){ return o[K.L()] || o.en; }

/* one colour family per community, taken from the client's map and
   lightened so it sits on a white background instead of a dark one */
var HUE = {
  warli:  {fill:"#CDB6DC", ink:"#7E5F9C"},
  bhil:   {fill:"#E7B394", ink:"#B4623A"},
  gond:   {fill:"#B9D097", ink:"#638A3E"},
  katkari:{fill:"#F2B3C0", ink:"#C05A6E"},
  koli:   {fill:"#9BD5DA", ink:"#3E8D95"},
  korku:  {fill:"#F2D488", ink:"#B98A1F"},
  thakar: {fill:"#E8AE9E", ink:"#AE4B36"},
  madia:  {fill:"#C8DEA6", ink:"#749B4F"},
  kolam:  {fill:"#E3C48F", ink:"#A97C36"}
};
/* where each community's medallion sits on the map */
var ANCHOR = {warli:"Palghar", katkari:"Raigad", thakar:"Sindhudurg", koli:"Ahmednagar",
  bhil:"Nandurbar", korku:"Amravati", gond:"Nagpur", madia:"Gadchiroli", kolam:"Yavatmal"};

/* colour every district by the first community that claims it */
function districtOwner(){
  var owner = {};
  K.TRIBES.forEach(function(tr){
    (tr.dist || []).forEach(function(d){ if (!owner[d]) owner[d] = tr.id; });
  });
  return owner;
}

function communityMap(opts){
  opts = opts || {};
  var owner = districtOwner(), sel = opts.selected;
  var paths = Object.keys(KMAP.d).map(function(d){
    var o = owner[d], h = o ? HUE[o] : null;
    var dim = sel && o !== sel;
    var fill = h ? h.fill : "#F1F0EA";
    return '<path d="'+KMAP.d[d]+'" fill="'+fill+'" fill-opacity="'+(dim ? .35 : 1)+'" '+
      'stroke="#FFFFFF" stroke-width="1"'+
      (o ? ' data-act="openTribe" data-arg="'+o+'" style="cursor:pointer"' : '')+'/>';
  }).join("");

  var medals = K.TRIBES.map(function(tr){
    var c = KMAP.c[ANCHOR[tr.id]]; if (!c) return "";
    var dim = sel && tr.id !== sel, r = dim ? 30 : 40;
    return '<g opacity="'+(dim ? .45 : 1)+'">'+
      '<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+(r/2+3)+'" fill="#FFFFFF"/>'+
      '<image href="'+KTRIBE[tr.id]+'" x="'+(c[0]-r/2)+'" y="'+(c[1]-r/2)+'" width="'+r+'" height="'+r+'"/></g>';
  }).join("");

  /* the artisan's own pin, only once they have joined */
  var me = "";
  if (S.profile.joined && S.profile.district && KMAP.c[S.profile.district]){
    var mc = KMAP.c[S.profile.district];
    me = '<circle cx="'+mc[0]+'" cy="'+mc[1]+'" r="15" fill="none" stroke="#6F0004" stroke-width="2.5" opacity=".6">'+
      '<animate attributeName="r" values="11;24" dur="2.2s" repeatCount="indefinite"/>'+
      '<animate attributeName="opacity" values=".6;0" dur="2.2s" repeatCount="indefinite"/></circle>'+
      '<circle cx="'+mc[0]+'" cy="'+mc[1]+'" r="7" fill="#6F0004" stroke="#FFFFFF" stroke-width="2.5"/>';
  }
  return '<svg viewBox="0 0 '+KMAP.w+' '+KMAP.h+'" width="100%" style="display:block">'+paths+
    '<g style="pointer-events:none">'+medals+me+'</g></svg>';
}
K.communityMap = communityMap;

/* ============================================================

   ============================================================ */

   {id:"f2", who:"Sakhu", tribe:"katkari", d:"Raigad", scope:"tribe", photo:"", when:Date.now()-3*86400e3,
    text:{en:"Bamboo is hard to get this month. Is anyone buying from Mahad side?",
          mr:"या महिन्यात बांबू मिळणं अवघड झालं आहे. महाडच्या बाजूने कोणी घेतंय का?",

    text:{en:"Sold four pieces at the Dhule market. Prices were better than last year.",
          mr:"धुळ्याच्या बाजारात चार वस्तू विकल्या. गेल्या वर्षापेक्षा भाव चांगला मिळाला.",

   {id:"f4", who:"Vithal", tribe:"thakar", d:"Thane", scope:"all", photo:"", when:Date.now()-9*86400e3,
    text:{en:"Teaching my grandson the puppet strings. He is quicker than I was.",
          mr:"नातवाला कळसूत्री बाहुल्यांच्या दोऱ्या शिकवतो आहे. माझ्यापेक्षा तो लवकर शिकतो.",
          hi:"पोते को कठपुतली की डोरियाँ सिखा रहा हूँ. मुझसे जल्दी सीखता है."}}

  save();
}
function ago(ms){
  var m = Math.floor((Date.now()-ms)/60000);
  if (m < 60) return L2(m+" min ago", m+" मिनिटांपूर्वी", m+" मिनट पहले");
  var h = Math.floor(m/60);
  if (h < 24) return L2(h+" h ago", h+" तासांपूर्वी", h+" घंटे पहले");
  var d = Math.floor(h/24);
  return L2(d+" d ago", d+" दिवसांपूर्वी", d+" दिन पहले");
}

/* ============================================================
   COMMUNITY SECTION
   ============================================================ */
var tab = "map", scope = "all";
act("openCommunities", function(){ tab = "map"; go("community"); });
act("commTab", function(x){ tab = x; K.rerender(); });
act("commScope", function(x){ scope = x; K.rerender(); });

view("community", function(){
  seedFeed();
  var tr = K.tribeById(S.profile.tribe);
  return K.head({title:t("communities")})+
  '<div class="pad" style="padding-top:2px">'+
    '<div class="seg">'+
      '<button class="'+(tab==="map"?"on":"")+'" data-act="commTab" data-arg="map">'+esc(t("commMap"))+'</button>'+
      '<button class="'+(tab==="feed"?"on":"")+'" data-act="commTab" data-arg="feed">'+esc(t("commPosts"))+'</button>'+
    '</div>'+
    (tab === "map" ? mapTab(tr) : feedTab(tr))+
    '<div style="height:26px"></div>'+
  '</div>';
});
after("community", function(){
  if (tab === "map" && !S.profile.joined && S.profile.tribe)
    setTimeout(function(){ Voice.speak(t("joinBody")); }, 350);
});

function joinCard(tr){
  if (!tr) return '<div class="card wash" style="margin-top:16px">'+
    '<p style="font-size:15.5px;line-height:1.5">'+esc(t("noTribeYet"))+'</p>'+
    '<button class="cta hollow" data-act="pickTribeLater" style="margin-top:14px">'+esc(t("chooseCommunity"))+'</button></div>';
  if (S.profile.joined) return "";
  return '<div class="card" style="margin-top:16px;border-color:var(--maroon)">'+
    '<div class="row"><img src="'+KTRIBE[tr.id]+'" alt="" style="width:52px;height:52px;flex:none">'+
      '<div style="flex:1"><b style="font-size:17px">'+esc(t("joinTitle").replace("{x}", K.tribeName(tr)))+'</b>'+
      '<div class="small" style="margin-top:3px">'+esc(t("joinBody"))+'</div></div></div>'+
    '<button class="cta" data-act="joinCommunity" style="margin-top:16px">'+
      ic("check",20,"#fff",2.6)+esc(t("joinCta"))+'</button></div>';
}
act("pickTribeLater", function(){ go("communitiesPick"); });
act("joinCommunity", function(){
  S.profile.joined = true; save(); log("community_joined", S.profile.tribe);
  toast(t("joinedOk")); Voice.speak(t("joinedOk"));
  K.rerender();
});

function mapTab(tr){
  var counts = {};
  K.PEERS.forEach(function(p){ counts[p.tribe] = (counts[p.tribe]||0) + 1; });
  if (S.profile.joined && S.profile.tribe) counts[S.profile.tribe] = (counts[S.profile.tribe]||0) + 1;
  return joinCard(tr)+
    '<div class="mapwrap" style="margin-top:16px">'+ communityMap({selected: null}) +'</div>'+
    '<p class="small" style="margin-top:8px">'+esc(t("mapLegendHint"))+'</p>'+
    '<div class="stack" style="margin-top:16px">'+ K.TRIBES.map(function(x){
      var h = HUE[x.id], mine = S.profile.tribe === x.id;
      return '<button class="listrow" data-act="openTribe" data-arg="'+x.id+'"'+
        (mine ? ' style="border-color:var(--maroon)"' : '')+'>'+
        '<img src="'+KTRIBE[x.id]+'" alt="" style="width:46px;height:46px;flex:none">'+
        '<span class="mid"><b style="display:flex;align-items:center;gap:8px">'+esc(K.tribeName(x))+
          (mine ? '<span class="pill tag mar" style="font-size:10.5px;padding:3px 9px;flex:none">'+esc(t("yours"))+'</span>' : '')+'</b>'+
          '<span>'+esc((x.dist||[]).map(K.dName).join(", "))+'</span></span>'+
        '<span style="width:12px;height:12px;border-radius:50%;background:'+h.ink+';flex:none"></span>'+
        '</button>'; }).join("")+
    '</div>';
}

function feedTab(tr){
  var posts = (S.feed||[]).filter(function(p){
    if (scope === "tribe") return tr && p.tribe === tr.id;
    return p.scope === "all" || (tr && p.tribe === tr.id);
  });
  return '<div class="chips" style="margin:16px 0 0">'+
      '<button class="chip'+(scope==="all"?" go":"")+'" data-act="commScope" data-arg="all">'+esc(t("scopeAll"))+'</button>'+
      '<button class="chip'+(scope==="tribe"?" go":"")+'" data-act="commScope" data-arg="tribe">'+
        esc(tr ? K.tribeName(tr) : t("scopeMine"))+'</button>'+
    '</div>'+
    '<button class="cta" data-act="composePost" style="margin-top:16px">'+ic("plus",20,"#fff",2.4)+esc(t("writePost"))+'</button>'+
    (posts.length
      ? '<div class="stack" style="margin-top:18px">'+posts.map(postCard).join("")+'</div>'
      : '<div class="card wash center" style="margin-top:18px;padding:28px"><p class="small">'+esc(t("noCommPosts"))+'</p></div>');
}
function postCard(p){
  var pt = K.tribeById(p.tribe);
  var body = typeof p.text === "string" ? p.text : P(p.text);
  return '<div class="card" style="padding:0;overflow:hidden">'+
    '<div class="row" style="padding:14px 16px 10px">'+
      (pt ? '<img src="'+KTRIBE[p.tribe]+'" alt="" style="width:38px;height:38px;flex:none">' : '')+
      '<div style="flex:1;min-width:0"><b style="font-size:16px">'+esc(p.who)+'</b>'+
        '<div class="small">'+esc(K.dName(p.d))+' · '+esc(ago(p.when))+'</div></div>'+
      '<span class="pill tag'+(p.scope==="tribe"?"":" ok")+'" style="font-size:10.5px">'+
        esc(p.scope === "tribe" ? (pt ? K.tribeName(pt) : t("scopeMine")) : t("scopeAll"))+'</span>'+
    '</div>'+
    '<p style="padding:0 16px 14px;font-size:16px;line-height:1.55">'+esc(body)+'</p>'+
    (p.photo ? '<img src="'+p.photo+'" alt="" style="width:100%;aspect-ratio:4/3;object-fit:cover">' : '')+
    '<div class="row" style="padding:12px 16px">'+
      '<button class="cta text sm" data-act="sayPost" data-arg="'+p.id+'" style="padding:0">'+ic("speak",16)+esc(t("listen"))+'</button>'+
    '</div></div>';
}
act("sayPost", function(id){
  var p = (S.feed||[]).filter(function(x){ return x.id === id; })[0]; if (!p) return;
  Voice.speak(p.who + ". " + (typeof p.text === "string" ? p.text : P(p.text)));
});

/* ---- write a post, by voice, and choose who sees it ---- */
var pdraft = null;
act("composePost", function(){
  pdraft = {text:"", photo:""};
  K.ask({q:t("postWhat"), qEn:te("postWhat"), h:t("postWhatH"),
    onAnswer:function(v){ pdraft.text = String(v).trim(); go("postScope"); }});
});
view("postScope", function(){
  var tr = K.tribeById(S.profile.tribe);
  return K.head({})+
  '<div class="pad" style="padding-top:10px">'+
    '<div class="card wash"><p style="font-size:16.5px;line-height:1.55">'+esc(pdraft.text)+'</p></div>'+
    '<div class="ask" style="margin-top:24px">'+esc(t("whoSees"))+'</div>'+
    '<div class="stack" style="margin-top:16px">'+
      '<button class="opt" aria-checked="'+(pdraft.scope!=="tribe")+'" data-act="setScope" data-arg="all">'+
        '<span class="glyph">'+ic("people",21,"#6F0004")+'</span>'+
        '<span class="txt"><b>'+esc(t("scopeAllT"))+'</b><span>'+esc(t("scopeAllB"))+'</span></span>'+
        '<span class="mark">'+(pdraft.scope!=="tribe"?ic("check",13,"#fff",3.2):"")+'</span></button>'+
      (tr ? '<button class="opt" aria-checked="'+(pdraft.scope==="tribe")+'" data-act="setScope" data-arg="tribe">'+
        '<span class="glyph" style="background:transparent"><img src="'+KTRIBE[tr.id]+'" alt="" style="width:46px;height:46px"></span>'+
        '<span class="txt"><b>'+esc(t("scopeTribeT").replace("{x}", K.tribeName(tr)))+'</b>'+
        '<span>'+esc(t("scopeTribeB"))+'</span></span>'+
        '<span class="mark">'+(pdraft.scope==="tribe"?ic("check",13,"#fff",3.2):"")+'</span></button>' : '')+
    '</div>'+
    (S.items.length ? '<div class="sect"><div class="sect-h"><h3>'+esc(t("attachPhoto"))+'</h3></div>'+
      '<div class="strip">'+S.items.slice(0,6).map(function(it){
        return '<button data-act="attachItem" data-arg="'+it.id+'" style="flex:none">'+
          '<img src="'+it.photo+'" alt="" style="width:72px;height:72px;border-radius:12px;object-fit:cover;'+
          (pdraft.photo===it.photo?'outline:2.5px solid var(--maroon);outline-offset:2px':'')+'"></button>'; }).join("")+
      '</div></div>' : '')+
  '</div>'+
  '<div class="foot"><button class="cta" data-act="sendPost">'+esc(t("sendPost"))+'</button></div>';
});
after("postScope", function(){ setTimeout(function(){ Voice.speak(t("whoSees")); }, 250); });
act("setScope", function(x){ pdraft.scope = x; K.rerender(); });
act("attachItem", function(id){
  var it = S.items.filter(function(x){ return x.id === id; })[0];
  pdraft.photo = (pdraft.photo === it.photo) ? "" : it.photo; K.rerender();
});
act("sendPost", function(){
  seedFeed();
  S.feed.unshift({id:"f"+Date.now(), who:S.profile.name || L2("You","तुम्ही","आप"),
    tribe:S.profile.tribe || "", d:S.profile.district || "Palghar",
    scope: pdraft.scope === "tribe" ? "tribe" : "all",
    photo: pdraft.photo, when: Date.now(), text: pdraft.text});
  save(); log("community_post", pdraft.scope || "all");
  toast(t("posted")); Voice.speak(t("posted"));
  tab = "feed"; scope = "all";
  go("community", null, true);
});

/* a way to choose a community if it was skipped during setup */
view("communitiesPick", function(){
  return K.head({title:t("chooseCommunity")})+
  '<div class="pad" style="padding-top:4px">'+
    '<p class="lede" style="margin-top:0">'+esc(t("tribeQH"))+'</p>'+
    '<div class="commgrid" style="margin-top:20px">'+ K.TRIBES.map(function(tr){
      return '<button class="commcell" data-act="setTribeNow" data-arg="'+tr.id+'">'+
        '<img src="'+KTRIBE[tr.id]+'" alt=""><b>'+esc(K.tribeName(tr))+'</b></button>'; }).join("")+
    '</div><div style="height:26px"></div>'+
  '</div>';
});
act("setTribeNow", function(id){
  var tr = K.tribeById(id); if (!tr) return;
  S.profile.tribe = id; S.profile.community = K.tribeName(tr); save();
  K.back();
});

})();
</script>

  {id:"fb", name:"Facebook", sub:{mr:"तुमच्या पानावर", hi:"आपके पेज पर",    en:"On your page"},     icon:"chat"}
];
function P(o){ return o[K.L()] || o.en; }

view("social", function(){
  S.cfg.connected = S.cfg.connected || {};
  var any = CHAN.some(function(c){ return S.cfg.connected[c.id]; });
  return K.head({})+ K.progress(99)+
  '<div class="pad" style="padding-top:12px">'+
    '<img class="orb live" src="'+KIMG.kalaFull+'" style="width:74px;height:74px;margin:6px auto 0" alt="">'+

    (te("socialTitle")?'<div class="gloss center">'+esc(te("socialTitle"))+'</div>':'')+
    '<p class="lede center" style="font-size:16px">'+esc(t("socialBody"))+'</p>'+
    '<div class="stack" style="margin-top:24px">'+ CHAN.map(function(c){
      var on = !!S.cfg.connected[c.id];
      return '<div class="listrow"'+(on?' style="border-color:var(--ok)"':'')+'>'+
        '<span style="width:46px;height:46px;border-radius:12px;background:'+(on?"var(--ok-soft)":"var(--wash)")+
          ';display:grid;place-items:center;flex:none">'+ic(c.icon,21,on?"#2E7D4F":"#6F0004")+'</span>'+
        '<span class="mid"><b>'+esc(c.name)+'</b><span>'+esc(P(c.sub))+'</span></span>'+
        (on ? '<span class="pill tag ok" style="font-size:12px">'+ic("check",13,"#2E7D4F",3)+' '+esc(t("connected"))+'</span>'
            : '<button class="cta sm" data-act="connectChan" data-arg="'+c.id+'">'+esc(t("connect"))+'</button>')+
      '</div>'; }).join("")+
    '</div>'+
    '<p class="small center" style="margin-top:16px">'+esc(t("socialDemo"))+'</p>'+
  '</div>'+
  '<div class="foot"><div class="stack">'+
    '<button class="cta" data-act="socialNext">'+esc(any ? t("continue") : t("socialSkip"))+'</button>'+
    (any ? '<button class="cta text" data-act="socialNext">'+esc(t("skip"))+'</button>' : '')+
  '</div></div>';
});
after("social", function(){
  setTimeout(function(){ Voice.speak(t("socialTitle")+" "+t("socialBody")); }, 320);
});
act("connectChan", function(id){
  S.cfg.connected = S.cfg.connected || {};
  S.cfg.connected[id] = true;
  S.cfg.channels = S.cfg.channels || {};
  S.cfg.channels[id] = true;
  S.cfg.autoPost = true;
  save(); log("social_connect", id);
  toast(t("connected"));
  K.rerender();
});
act("socialNext", function(){ go("ready", null, true); });

/* every view is registered by now — start the app */
document.documentElement.lang = S.lang || "mr";
K.boot();
})();
</script>
