<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Karagir</title>
<style>
:root{
  /* palette sampled from the client's own screens */
  --paper:#FFFFFF;
  --wash:#F3F3ED;
  --wash-2:#FAFAF7;
  --ink:#101828;
  --muted:#6A7282;
  --muted-2:#9AA1AC;
  --line:#E5E7EB;
  --line-2:#D7D9DC;
  --maroon:#6F0004;
  --maroon-soft:#FBF1F1;
  --gold:#EFAC00;
  --gold-soft:#FDF6E3;
  --ok:#2E7D4F;
  --ok-soft:#EAF4EE;
  --r:14px; --r-lg:20px; --r-xl:26px; --r-pill:999px;
  --pad:24px;
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Nirmala UI",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#EDEDE8;color:var(--ink);font-family:var(--font);
  font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--maroon);outline-offset:3px;border-radius:8px}

/* ---------- iPhone 16: 393 x 852 ---------- */
#stage{min-height:100dvh}
#phone{position:relative;width:100%;max-width:393px;height:100dvh;margin:0 auto;
  background:var(--paper);overflow:hidden;display:flex;flex-direction:column}

/* on a desktop window the phone is drawn inside a bezel and scaled to fit */
body.framed{background:#171614;display:grid;place-items:center;min-height:100dvh;padding:16px}
body.framed #stage{display:grid;place-items:center;min-height:0}
body.framed #phone{
  width:393px;height:852px;max-width:none;border-radius:56px;
  transform:scale(var(--fit,1));transform-origin:center center;
  box-shadow:0 0 0 12px #1E1D1B,0 0 0 13px #46433E,0 0 0 15px #121110,0 44px 90px rgba(0,0,0,.55);
}
body.framed{--st:56px;--sb:26px}
/* dynamic island */
body.framed #phone::before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:120px;height:35px;border-radius:20px;background:#08080A;z-index:220}
/* home indicator */
body.framed #phone::after{content:"";position:absolute;bottom:9px;left:50%;transform:translateX(-50%);
  width:140px;height:5px;border-radius:3px;background:#101828;opacity:.3;z-index:220}
/* a status bar, so the frame reads as a phone rather than a rounded box */
body.framed #statusbar{display:flex}
#statusbar{display:none;position:absolute;top:0;left:0;right:0;height:56px;z-index:210;
  align-items:center;justify-content:space-between;padding:14px 34px 0;pointer-events:none;
  font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
#statusbar .sbr{display:flex;align-items:center;gap:6px}
#statusbar .bat{width:24px;height:12px;border:1.4px solid var(--ink);border-radius:3px;position:relative;opacity:.9}
#statusbar .bat::after{content:"";position:absolute;top:2px;left:2px;bottom:2px;width:13px;background:var(--ink);border-radius:1px}
#statusbar .bat::before{content:"";position:absolute;right:-4px;top:3.5px;width:2px;height:5px;background:var(--ink);border-radius:0 2px 2px 0}
#framelabel{display:none}
body.framed #framelabel{display:block;position:fixed;left:50%;transform:translateX(-50%);
  bottom:14px;color:#6C6862;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
#screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.pad{padding-left:var(--pad);padding-right:var(--pad)}

/* ---------- top ---------- */
.head{display:flex;align-items:center;gap:14px;padding:calc(var(--st) + 12px) var(--pad) 8px}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--wash);transition:transform .12s ease}
.round:active{transform:scale(.92)}
.round.bare{background:transparent}
.round.line{background:var(--paper);border:1px solid var(--line)}
.head .grow{flex:1}

/* thin setup progress, Hinge-style */
.bar{height:3px;background:var(--line);margin:6px var(--pad) 0;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--maroon);border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ---------- type ---------- */
.display{font-size:33px;line-height:1.14;font-weight:700;letter-spacing:-.028em}
.title{font-size:27px;line-height:1.2;font-weight:700;letter-spacing:-.022em}
.ask{font-size:24px;line-height:1.26;font-weight:700;letter-spacing:-.016em}
.lede{font-size:17px;line-height:1.5;color:var(--muted);margin-top:10px}
.gloss{font-size:14.5px;line-height:1.4;color:var(--muted-2);margin-top:5px}
.label{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:12px}
.small{font-size:13.5px;color:var(--muted-2);line-height:1.45}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;
  padding:16px 22px;border-radius:var(--r-pill);background:var(--maroon);color:#fff;
  font-size:18px;font-weight:700;letter-spacing:-.01em;transition:transform .12s ease,opacity .15s}
.cta:active{transform:scale(.98)}
.cta[disabled]{opacity:.32;pointer-events:none}
.cta.hollow{background:var(--paper);color:var(--ink);border:1.5px solid var(--line-2)}
.cta.soft{background:var(--wash);color:var(--ink)}
.cta.text{background:none;color:var(--maroon);min-height:50px;font-size:16px;font-weight:600}
.cta.sm{min-height:46px;font-size:15.5px;padding:10px 18px;width:auto}
.foot{position:sticky;bottom:0;padding:14px var(--pad) calc(14px + var(--sb));
  background:linear-gradient(to top,var(--paper) 74%,rgba(255,255,255,0))}
.pair{display:flex;gap:10px}.pair>*{flex:1}

/* ---------- selection ---------- */
.pills{display:flex;flex-wrap:wrap;gap:9px}
.pill{padding:11px 20px;border-radius:var(--r-pill);border:1.5px solid var(--line);
  background:var(--paper);font-size:16px;font-weight:600;transition:.15s}
.pill[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.tag{background:var(--wash);border-color:transparent;font-size:14px;padding:8px 14px;font-weight:600}
.pill.tag.gold{background:var(--gold-soft)}
.pill.tag.ok{background:var(--ok-soft);color:var(--ok)}
.pill.tag.mar{background:var(--maroon-soft);color:var(--maroon)}

/* full-width option row — the main setup control */
.opt{display:flex;align-items:center;gap:15px;width:100%;text-align:left;
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-lg);
  padding:17px 18px;min-height:78px;transition:border-color .15s,background .15s}
.opt:active{background:var(--wash-2)}
.opt[aria-checked="true"]{border-color:var(--maroon);background:var(--wash)}
.opt .glyph{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--wash)}
.opt[aria-checked="true"] .glyph{background:var(--paper)}
.opt .txt{flex:1;min-width:0}
.opt .txt b{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em}
.opt .txt span{display:block;font-size:14.5px;color:var(--muted);margin-top:2px}
.opt .txt em{display:block;font-size:13px;color:var(--muted-2);font-style:normal;margin-top:1px}
.opt .mark{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--line-2);flex:none;display:grid;place-items:center}
.opt[aria-checked="true"] .mark{background:var(--maroon);border-color:var(--maroon)}

/* small tile cards, 2-up or 3-up, as in the reference */
.tiles{display:grid;gap:10px}
.tiles.c2{grid-template-columns:1fr 1fr}
.tiles.c3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-lg);
  padding:16px 12px;text-align:center;transition:.15s;min-height:104px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.tile[aria-checked="true"]{border-color:var(--maroon);background:var(--wash)}
.tile b{font-size:15.5px;font-weight:700;line-height:1.2}
.tile span{font-size:12.5px;color:var(--muted);line-height:1.25}

/* ---------- cards & rows ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.card.wash{background:var(--wash);border-color:transparent}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:13px}
.sep{height:1px;background:var(--line)}
.sect{margin-top:30px}
.sect-h{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.sect-h h3{font-size:19px;font-weight:700;letter-spacing:-.015em}
.sect-h .grow{flex:1}
.listrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px}
.listrow.wash{background:var(--wash);border-color:transparent}
.listrow .th{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--wash)}
.listrow .mid{flex:1;min-width:0}
.listrow .mid b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.listrow .mid span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.big{font-size:34px;font-weight:700;letter-spacing:-.025em}
.photo{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:var(--r-xl);background:var(--wash)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sq{position:relative;border-radius:var(--r);overflow:hidden;background:var(--wash);aspect-ratio:1/1}
.sq img{width:100%;height:100%;object-fit:cover}

/* ---------- Kala ---------- */
.orb{display:block;margin:0 auto}
.orb.live{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.orb.live{animation:none}}

.thread{padding:4px var(--pad) 10px}
.msg{display:flex;gap:10px;margin-bottom:15px;align-items:flex-start;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}}
.msg .av{width:34px;height:34px;border-radius:50%;flex:none;margin-top:3px}
.msg .bub{background:var(--wash);border-radius:20px;border-top-left-radius:7px;padding:14px 16px;max-width:83%}
.msg .bub .lead{font-size:18px;font-weight:600;line-height:1.4;letter-spacing:-.01em}
.msg .bub .sub{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.35}
.msg.mine{justify-content:flex-end}
.msg.mine .bub{background:var(--maroon);color:#fff;border-radius:20px;border-bottom-right-radius:7px}
.msg.mine .bub .lead{font-weight:500;font-size:17px}
.hear{margin-top:10px;display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--maroon);font-weight:700}
.dots{display:flex;gap:5px;padding:5px 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted-2);animation:bl 1.1s infinite}
.dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 16px 44px}
.chip{border:1.5px solid var(--line-2);background:var(--paper);border-radius:var(--r-pill);
  padding:11px 17px;font-size:15.5px;font-weight:600}
.chip:active{background:var(--wash)}
.chip[aria-pressed="true"]{background:var(--wash);border-color:var(--maroon)}
.chip.go{background:var(--maroon);color:#fff;border-color:var(--maroon)}

/* ---------- mic dock ---------- */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:30;
  padding:10px var(--pad) calc(12px + var(--sb));
  background:linear-gradient(to top,var(--paper) 80%,rgba(255,255,255,0));pointer-events:none}
.dock .mic,.dock .cta,.dock .typebar,.dock input,.dock .send{pointer-events:auto}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.miccap{font-size:15px;font-weight:700;text-align:center;min-height:40px}
.miccap small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:1px}
.mic{width:86px;height:86px;border-radius:50%;background:var(--maroon);display:grid;place-items:center;
  box-shadow:0 10px 26px rgba(111,0,4,.28);position:relative;flex:none;
  transition:transform .12s ease,background .15s;touch-action:none}
.mic:active{transform:scale(.94)}
.mic.hot{background:#A8121A;transform:scale(1.06)}
.mic.hot::before,.mic.hot::after{content:"";position:absolute;inset:-8px;border-radius:50%;
  border:3px solid rgba(168,18,26,.45);animation:ping 1.6s infinite}
.mic.hot::after{animation-delay:.8s}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(1.55);opacity:0}}
.mic.wait{background:var(--muted-2);box-shadow:none}
.typebar{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);
  border-radius:var(--r-pill);padding:5px 5px 5px 18px;min-height:52px;width:100%;margin-top:4px}
.typebar input{flex:1;border:0;outline:0;background:transparent;min-width:0;font-size:16px}
.send{width:42px;height:42px;border-radius:50%;background:var(--maroon);display:grid;place-items:center;flex:none}

/* ---------- tab bar ---------- */
.tabs{display:flex;align-items:flex-end;background:var(--paper);border-top:1px solid var(--line);
  padding:9px 8px calc(8px + var(--sb));flex:none;z-index:40}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;color:var(--muted-2)}
.tabs button span{font-size:11px;font-weight:600;letter-spacing:-.01em}
.tabs button[aria-current="page"]{color:var(--maroon)}
.tabs .kala{margin-top:-26px}
.tabs .kala img{width:54px;height:54px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 6px 16px rgba(111,0,4,.26)}

/* ---------- search ---------- */
.searchbar{display:flex;align-items:center;gap:11px;background:var(--wash);border-radius:var(--r-pill);
  padding:13px 17px;width:100%;text-align:left;color:var(--muted)}
.searchbar b{flex:1;font-size:16px;font-weight:500;color:var(--muted)}

/* ---------- coach marks ---------- */
.coach{position:absolute;inset:0;z-index:90}
.hole{position:absolute;border-radius:20px;box-shadow:0 0 0 9999px rgba(16,24,40,.74);
  transition:all .32s cubic-bezier(.4,0,.2,1);pointer-events:none}
.coachcard{position:absolute;left:16px;right:16px;background:var(--paper);border-radius:var(--r-xl);
  padding:20px;box-shadow:0 18px 44px rgba(0,0,0,.3);animation:in .3s ease both}
.coachcard .lead{font-size:19px;font-weight:700;line-height:1.3;letter-spacing:-.015em}
.coachcard p{font-size:15.5px;color:var(--muted);line-height:1.45;margin-top:8px}
.coachcard .rowend{display:flex;align-items:center;gap:10px;margin-top:18px}
.coachcard .steps{display:flex;gap:5px;flex:1}
.coachcard .steps i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.coachcard .steps i.on{background:var(--maroon);width:18px;border-radius:4px}
.beak{position:absolute;width:16px;height:16px;background:var(--paper);transform:rotate(45deg)}

/* ---------- misc ---------- */
.sheet{position:absolute;inset:0;z-index:80;background:rgba(16,24,40,.5);display:flex;align-items:flex-end}
.sheet .in{background:var(--paper);width:100%;border-radius:28px 28px 0 0;
  padding:16px var(--pad) calc(20px + var(--sb));max-height:88%;overflow:auto;animation:up .28s ease}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.grab{width:40px;height:4px;border-radius:3px;background:var(--line-2);margin:0 auto 16px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:104px;z-index:95;
  background:var(--ink);color:#fff;padding:13px 19px;border-radius:var(--r-pill);
  font-size:15px;font-weight:600;max-width:86%;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--maroon);
  animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(1turn)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keypad button{height:60px;border-radius:16px;background:var(--wash);font-size:26px;font-weight:600}
.keypad button:active{background:var(--line)}
.otp{display:flex;gap:11px;justify-content:center}
.otp i{width:52px;height:62px;border-radius:16px;background:var(--wash);display:grid;place-items:center;
  font-size:26px;font-weight:700;font-style:normal}
.otp i.on{background:var(--paper);box-shadow:inset 0 0 0 2px var(--maroon)}
.field{width:100%;border:1.5px solid var(--line-2);border-radius:14px;padding:15px;background:var(--paper);outline:0;font-size:17px}
.field:focus{border-color:var(--maroon)}
textarea.field{min-height:100px;resize:vertical}
.warn{background:var(--gold-soft);color:#7A5300;font-size:13px;padding:9px var(--pad);text-align:center;font-weight:600}
.postcard{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line)}
.postcard img{width:100%;aspect-ratio:1/1;object-fit:cover}
.postcard .cap{padding:15px;font-size:15px;line-height:1.5;white-space:pre-wrap}
.wm{position:absolute;left:12px;bottom:12px;background:rgba(16,24,40,.7);color:#fff;font-size:11.5px;
  font-weight:700;padding:6px 11px;border-radius:var(--r-pill)}
.center{text-align:center}
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 0 4px}
.credits{font-size:12px;color:var(--muted);line-height:1.6}
.credits a{color:var(--maroon)}
</style>
</head>
<body>
<div id="stage">
  <div id="phone">
    <div id="statusbar"><span id="sbtime">9:41</span>
      <span class="sbr">
        <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><path d="M1 9.5v2M5 7v4.5M9 4v7.5M13 1v10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg width="15" height="12" viewBox="0 0 15 12" aria-hidden="true"><path d="M1.2 4.2a9 9 0 0 1 12.6 0M3.7 6.8a5.5 5.5 0 0 1 7.6 0M7.5 10.2h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        <span class="bat"></span>
      </span>
    </div>
    <div id="screen"></div>
    <div id="tabslot"></div>
  </div>
</div>
<div id="framelabel">Karagir prototype</div>
<style>
/* tribe medallions */
.tribegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:2px 0 16px 44px}
.tribe{display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 4px;
  border-radius:var(--r-lg);border:1.5px solid transparent;background:var(--paper);transition:.15s}
.tribe img{width:100%;max-width:74px;height:auto;aspect-ratio:1/1;object-fit:contain}
.tribe span{font-size:12.5px;font-weight:700;line-height:1.2;text-align:center;letter-spacing:-.01em}
.tribe[aria-pressed="true"]{border-color:var(--maroon);background:var(--wash)}
.tribe:active{background:var(--wash)}
/* the Karagir map */
.mapwrap{margin-top:16px;background:var(--wash);border-radius:var(--r-lg);padding:6px;overflow:hidden}
.mapwrap svg{width:100%;height:auto}
.mapwrap path{transition:fill .2s}
</style>
<style>
/* the raised Kala tab needs a notch, or it slices whatever scrolls behind it */
.tabs{position:relative;overflow:visible}
.tabs button{min-width:0}
.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:10.5px}
.tabs .kala{position:relative;margin-top:0}
.tabs .kala::before{content:"";position:absolute;left:50%;top:-31px;transform:translateX(-50%);
  width:76px;height:76px;border-radius:50%;background:var(--paper);z-index:0}
.tabs .kala img{position:relative;z-index:1;margin-top:-28px;width:54px;height:54px}
.tabs .kala span{position:relative;z-index:1;margin-top:2px}

/* workshops, events, communities */
.evrow{display:flex;gap:14px;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;align-items:center}
.evdate{width:56px;flex:none;text-align:center;background:var(--wash);border-radius:12px;padding:8px 4px}
.evdate b{display:block;font-size:20px;font-weight:700;line-height:1}
.evdate span{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.commgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.commcell{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px;
  border-radius:var(--r-lg);background:var(--paper);border:1.5px solid transparent}
.commcell img{width:100%;max-width:76px;aspect-ratio:1/1;object-fit:contain}
.commcell b{font-size:13px;font-weight:700;line-height:1.15;text-align:center}
.commcell span{font-size:11px;color:var(--muted)}
.hero{position:relative;background:var(--wash);border-radius:var(--r-xl);padding:24px 18px;text-align:center}
.hero img.medal{width:112px;height:112px;margin:0 auto}
.draftnote{background:var(--gold-soft);color:#7A5300;border-radius:12px;padding:11px 14px;
  font-size:12.5px;line-height:1.45;font-weight:600}
.chanrow{display:flex;align-items:center;gap:13px;padding:14px;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-lg)}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line-2);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw[aria-checked="true"]{background:var(--maroon)}
.sw[aria-checked="true"] i{left:23px}
</style>
<style>
/* segmented control for the community section */
.seg{display:flex;background:var(--wash);border-radius:var(--r-pill);padding:4px;margin-top:8px}
.seg button{flex:1;padding:11px 8px;border-radius:var(--r-pill);font-size:15.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.1)}
</style>
<style>
/* photo strip — borders and inset badges so nothing is clipped by the scroller */
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;-webkit-overflow-scrolling:touch}
.pthumb{position:relative;flex:none;width:84px;height:84px;border-radius:12px;overflow:hidden;
  border:2.5px solid transparent;box-sizing:border-box;background:var(--wash)}
.pthumb.cover{border-color:var(--maroon)}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pdel{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;
  background:rgba(16,24,40,.78);display:grid;place-items:center}
.pcov{position:absolute;left:4px;bottom:4px;background:var(--maroon);color:#fff;font-size:10px;
  font-weight:700;padding:2px 7px;border-radius:999px}
.padd{flex:none;width:84px;height:84px;border-radius:12px;border:1.5px dashed var(--line-2);
  display:grid;place-items:center;background:var(--paper)}

/* section headings must not squeeze into a column when an action sits beside them */
.sect-h h3{flex:1;min-width:0}
.sect-h .grow{flex:0}
.sect-h .cta.text,.sect-h .round{flex:none;white-space:nowrap}

/* profile picture with the community badge set into its lower edge */
.avatarwrap{position:relative;width:118px;margin:4px auto 0}
.avatarwrap>img.face,.avatarwrap>.face{width:118px;height:118px;border-radius:50%;object-fit:cover;display:block;background:var(--wash)}
.avatarwrap .seal{position:absolute;right:2px;bottom:2px;width:44px;height:44px;border-radius:50%;
  background:var(--paper);box-shadow:0 0 0 3px var(--paper),0 2px 8px rgba(16,24,40,.16)}
</style>
<style>
.cta.text{padding:10px 14px}
.sect-h{align-items:center}
.sect-h h3{flex:1;min-width:0;line-height:1.25}
</style>
<style>
/* background agents show as a quiet tag — Kala is still the only voice */
.atag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  background:var(--wash);color:var(--muted-2);font-size:10.5px;font-weight:700;
  letter-spacing:.02em;line-height:1.4;flex:none;vertical-align:middle}
.atag i{width:5px;height:5px;border-radius:50%;background:var(--muted-2);display:block}
.atag.on{background:var(--maroon-soft);color:var(--maroon)}
.atag.on i{background:var(--maroon)}
</style>
<style>
.head .htitle{flex:1;min-width:0;font-size:19px;font-weight:700;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
<style>
/* product cards */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{display:flex;flex-direction:column;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.pcard .pimg{position:relative;width:100%;aspect-ratio:1/1;background:var(--wash)}
.pcard .pimg img{width:100%;height:100%;object-fit:cover}
.pcard .pflag{position:absolute;left:8px;top:8px;font-size:10.5px;font-weight:700;
  padding:4px 9px;border-radius:999px;background:var(--gold);color:#3B2A00}
.pcard .pflag.ok{background:var(--ok-soft);color:var(--ok)}
.pcard .pbody{padding:11px 12px 13px}
.pcard .pname{display:block;font-size:15px;font-weight:700;line-height:1.25;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pprice{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:5px}
.pcard .pmeta{font-size:12px;color:var(--muted);margin-top:3px}
.pcard .ptags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pcard .ptags span{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;
  background:var(--wash);color:var(--muted)}
/* the product page */
.tline{position:relative;padding-left:26px}
.tline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tline .tev{position:relative;padding:7px 0}
.tline .tev::before{content:"";position:absolute;left:-23px;top:13px;width:10px;height:10px;
  border-radius:50%;background:var(--maroon);box-shadow:0 0 0 3px var(--paper)}
.tline .tev b{display:block;font-size:15.5px;font-weight:700}
.tline .tev span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.swrow{display:flex;align-items:center;gap:13px;width:100%;text-align:left}
</style>
<style>
/* the card is built from spans, so each part needs its own box */
.pcard .pimg,.pcard .pbody{display:block}
.pcard .pprice,.pcard .pmeta{display:block}
.pcard .ptags{display:flex}
</style>
<style>
/* a notification is a card: what arrived, who it is from, and a way in */
.notif{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px}
.notif .nrow{display:flex;align-items:center;gap:13px}
.notif .nrow img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}
.notif .nmid{flex:1;min-width:0}
.notif .nmid b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.notif .nmid span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notif .cta{margin-top:12px;min-height:46px;font-size:15.5px}
</style>
<style>
#framelabel #restartbtn{margin-left:12px;color:#C9A227;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;pointer-events:auto}
#framelabel{pointer-events:none}
</style>

   KARAGIR — core runtime
   ============================================================ */
(function(){
"use strict";

/* ---------------- state ---------------- */
var KEY = "karagir.v4";
var DEFAULT = {
  lang: null, phone: "", role: "artisan",
  profile: {name:"", place:"", community:"", craft:"", learn:"", years:"", process:"", materials:[], products:[], story:"", storyEn:"", photo:"", workPhoto:"", workPhotos:[]},
  items: [], orders: [], workshops: [], posts: [], earnings: {paid: 0, pending: 0, log: []},
  onboarded: false, coach: {},
  cfg: {apiKey:"", model:"claude-sonnet-5", autoSpeak:true, rate:0.9, brain:"auto",
        autoPost:false, channels:{wa:true, ig:true, fb:false}},
  log: []
};
var S;
try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ S = null; }
if (!S || !S.cfg) S = JSON.parse(JSON.stringify(DEFAULT));

/* karagir.html#fresh replays the whole flow from the splash screen.
   Handled here, before anything reads the state, so there is no reload to race. */
if (location.hash === "#fresh"){
  var keepCfg = S.cfg ? JSON.parse(JSON.stringify(S.cfg)) : null;
  S = JSON.parse(JSON.stringify(DEFAULT));
  if (keepCfg) S.cfg = keepCfg;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
}
var quotaWarned = false;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){
    /* photos are the only thing big enough to fill the quota — drop the log, then warn once */
    try { S.log = S.log.slice(-40); localStorage.setItem(KEY, JSON.stringify(S)); return; } catch(e2){}
    if (!quotaWarned){
      quotaWarned = true;
      setTimeout(function(){ toast("This phone is out of space for photos. Download the session log, then start a fresh session."); }, 400);
    }
  }
}
function reset(){ S = JSON.parse(JSON.stringify(DEFAULT)); save(); location.reload(); }
window.KG = { S:S, save:save, reset:reset };

/* ---------------- session logging (for user testing) ---------------- */
var T0 = Date.now();
function log(ev, data){
  S.log.push({ms: Date.now()-T0, at: new Date().toISOString(), screen: CUR, ev: ev, data: data===undefined?null:data});
  if (S.log.length > 900) S.log.splice(0, 300);
  save();
}
window.KG.log = log;

/* ---------------- i18n ---------------- */
function L(){ return S.lang || "mr"; }
function t(k){ var s = window.STR[k]; return s ? (s[L()] || s.en) : "?"+k; }
function te(k){ if (L()==="en") return ""; var s = window.STR[k]; return s ? s.en : ""; }
/* big line + small English line */
function T(k, cls){
  var a = esc(t(k)), b = esc(te(k));
  return '<div class="'+(cls||"")+'">'+a+'</div>' + (b ? '<div class="en">'+b+'</div>' : '');
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function localeTag(){ return {mr:"mr-IN", hi:"hi-IN", en:"en-IN"}[L()]; }
window.KG.t=t; window.KG.te=te; window.KG.T=T; window.KG.esc=esc; window.KG.L=L;

/* ---------------- icons (no emoji anywhere) ---------------- */
var I = {

  mic:   'M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3',

  bag:   'M5 8h14l-1 12H6L5 8zm3.5 0V6a3.5 3.5 0 1 1 7 0v2',

  spark: 'M12 4l1.6 4.4L18 10l-4.4 1.6L12 16l-1.6-4.4L6 10l4.4-1.6L12 4z',

  wa:    'M12 3.5A8.4 8.4 0 0 0 4.6 16L3.6 20.4l4.5-1a8.4 8.4 0 1 0 3.9-15.9zM9 8.6c.2-.5.4-.5.7-.5h.5c.2 0 .4 0 .6.5l.7 1.7c.1.3 0 .5-.1.6l-.4.5c-.1.2-.2.3 0 .6.2.3.8 1.3 1.7 1.8 1 .6 1.2.5 1.4.3l.5-.6c.2-.2.4-.2.6-.1l1.5.8c.3.1.4.3.4.5s0 .9-.4 1.3c-.4.4-1 .6-1.7.5-1.3-.2-3-.9-4.3-2.3-1.4-1.4-2-2.9-2.1-3.9-.1-.7.1-1.3.4-1.7z',
  box:   'M4 8l8-4 8 4v8l-8 4-8-4V8zm0 0l8 4 8-4M12 12v8',
  people:'M9 12a3.2 3.2 0 1 0 0-6.4A3.2 3.2 0 0 0 9 12zM2.5 19c.8-3 3.3-4.6 6.5-4.6s5.7 1.6 6.5 4.6M16.5 11.5a2.6 2.6 0 1 0 0-5.2M18 14.4c2 .5 3.3 1.9 3.8 4',
  x:     'M6 6l12 12M18 6L6 18'
};
function ic(name, size, col, sw){
  /* the rupee sign is far more legible as the actual glyph than as a stroked path */
  if (name === "money"){
    return '<svg width="'+(size||24)+'" height="'+(size||24)+'" viewBox="0 0 24 24" aria-hidden="true">'+
      '<text x="12" y="18.5" text-anchor="middle" fill="'+(col||"currentColor")+'" '+
      'font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" '+
      'font-size="20" font-weight="600">\u20B9</text></svg>';
  }
  return '<svg width="'+(size||24)+'" height="'+(size||24)+'" viewBox="0 0 24 24" fill="none" '+
    'stroke="'+(col||"currentColor")+'" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
    '<path d="'+I[name]+'"/></svg>';
}
function icf(name, size, col){ /* filled */
  return '<svg width="'+(size||24)+'" height="'+(size||24)+'" viewBox="0 0 24 24" fill="'+(col||"currentColor")+'" aria-hidden="true"><path d="'+I[name]+'"/></svg>';
}
window.KG.ic = ic; window.KG.icf = icf;

/* ---------------- router ---------------- */
var VIEWS = {}, CUR = "", STACK = [];
function view(name, fn){ VIEWS[name] = fn; }
function go(name, arg, replace){
  if (CUR && !replace) STACK.push({n:CUR, a:LASTARG});
  render(name, arg);
}
var LASTARG = null;
function back(){
  Voice.cancel(); Voice.stop();
  var p = STACK.pop();
  if (p) render(p.n, p.a); else render("home");
}
function render(name, arg){
  Voice.cancel();
  CUR = name; LASTARG = arg||null;
  log("screen", name);
  var el = document.getElementById("screen");
  el.scrollTop = 0;
  var ph = document.getElementById("phone");
  var oldDock = ph.querySelector(":scope > .dock"); if (oldDock) oldDock.remove();
  var oldCoach = ph.querySelector(".coach"); if (oldCoach){ oldCoach.remove(); COACH = null; }
  el.innerHTML = VIEWS[name] ? VIEWS[name](arg||{}) : "<p class='pad'>Missing view: "+name+"</p>";
  var nd = el.querySelector(".dock"); if (nd) ph.appendChild(nd);
  fitDock();
  document.getElementById("tabslot").innerHTML = NAVED[name] ? navHTML(name) : "";
  bind(el);
  bind(ph);
  bind(document.getElementById("tabslot"));
  if (AFTER[name]) AFTER[name](arg||{});
}
var AFTER = {};
function after(name, fn){ AFTER[name] = fn; }
/* the mic dock floats over the scroll area, so reserve exactly its height */
function fitDock(){
  requestAnimationFrame(function(){
    var ph = document.getElementById("phone"), sc = document.getElementById("screen");
    var d = ph.querySelector(":scope > .dock");
    if (d){ sc.style.paddingBottom = (d.offsetHeight + 18) + "px"; return; }
    /* the Kala tab orb rises above the bar, so keep content clear of it */
    sc.style.paddingBottom = document.querySelector(".tabs") ? "34px" : "0px";
  });
}
window.KG.fitDock = fitDock;
window.KG.view=view; window.KG.go=go; window.KG.back=back; window.KG.after=after;
window.KG.rerender = function(){ render(CUR, LASTARG); };
window.KG.cur = function(){ return CUR; };

/* delegated actions: data-act="fnName" data-arg="..." */
var ACTS = {};
function act(name, fn){ ACTS[name] = fn; }
window.KG.act = act;
function bind(root){
  if (!root) return;
  root.querySelectorAll("[data-act]").forEach(function(n){
    if (n.__b) return; n.__b = 1;
    n.addEventListener("click", function(e){
      var f = ACTS[n.getAttribute("data-act")];
      if (f){ log("tap", n.getAttribute("data-act")+(n.getAttribute("data-arg")?":"+n.getAttribute("data-arg"):"")); f(n.getAttribute("data-arg"), n, e); }
    });
  });
}
window.KG.bind = bind;

/* ---------------- tab bar ---------------- */
var NAVED = {home:1, work:1, money:1, community:1};
function navHTML(cur){
  function tab(id, icon, key){
    return '<button data-act="nav" data-arg="'+id+'" '+(cur===id?'aria-current="page"':'')+'>'+
      ic(icon,23)+'<span>'+esc(t(key))+'</span></button>';
  }
  return '<div class="tabs">'+
    tab("home","home","navHome")+
    tab("work","bag","navWork")+
    '<button class="kala" data-act="openKala"><img src="'+KIMG.kalaDisc+'" alt=""><span style="margin-top:3px">'+esc(t("navKala"))+'</span></button>'+
    tab("money","money","navMoney")+
    tab("community","people","navCommunity")+
  '</div>';
}
act("nav", function(a){ render(a); STACK.length = 0; });

/* ---------------- toast ---------------- */
var tmr;
function toast(msg){
  var old = document.querySelector(".toast"); if (old) old.remove();
  var d = document.createElement("div"); d.className = "toast"; d.textContent = msg;
  document.getElementById("phone").appendChild(d);
  clearTimeout(tmr); tmr = setTimeout(function(){ d.remove(); }, 2600);
}
window.KG.toast = toast;

/* ---------------- bottom sheet ---------------- */
function sheet(html){
  var d = document.createElement("div"); d.className = "sheet";
  d.innerHTML = '<div class="in"><div class="grab"></div>'+html+'</div>';
  d.addEventListener("click", function(e){ if (e.target === d) closeSheet(); });
  document.getElementById("phone").appendChild(d); bind(d);
  return d;
}
function closeSheet(){ var s = document.querySelector(".sheet"); if (s) s.remove(); }
window.KG.sheet = sheet; window.KG.closeSheet = closeSheet;
act("closeSheet", closeSheet);

/* ============================================================
   VOICE — speech recognition + speech synthesis
   ============================================================ */
var Voice = {
  supported: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
  rec: null, listening: false, onResult: null, onState: null, _final: "",
  ttsReady: false, voices: [],

  loadVoices: function(){
    if (!window.speechSynthesis) return;
    Voice.voices = speechSynthesis.getVoices() || [];
  },

  pickVoice: function(){
    var want = localeTag(), v = Voice.voices;
    if (!v.length) Voice.loadVoices(), v = Voice.voices;
    var exact = v.filter(function(x){ return x.lang && x.lang.replace("_","-").toLowerCase() === want.toLowerCase(); });
    if (exact.length) return exact[0];
    var base = want.split("-")[0];
    var loose = v.filter(function(x){ return x.lang && x.lang.toLowerCase().indexOf(base) === 0; });
    if (loose.length) return loose[0];
    if (base === "mr"){ /* Marathi voices are rare — Hindi is the closest intelligible fallback */
      var hi = v.filter(function(x){ return x.lang && x.lang.toLowerCase().indexOf("hi") === 0; });
      if (hi.length) return hi[0];
    }
    var inen = v.filter(function(x){ return x.lang && x.lang.toLowerCase().indexOf("en-in") === 0; });
    return inen[0] || v[0] || null;
  },

  speak: function(text, done){
    if (!window.speechSynthesis || !text){ if (done) done(); return; }
    try { speechSynthesis.cancel(); } catch(e){}
    var u = new SpeechSynthesisUtterance(String(text).replace(/\s+/g," ").trim());
    var vo = Voice.pickVoice();
    if (vo) u.voice = vo;
    u.lang = (vo && vo.lang) || localeTag();
    u.rate = S.cfg.rate || 0.9; u.pitch = 1;
    u.onend = function(){ if (done) done(); };
    u.onerror = function(){ if (done) done(); };
    try { speechSynthesis.speak(u); } catch(e){ if (done) done(); }
  },
  cancel: function(){ try{ speechSynthesis.cancel(); }catch(e){} },

  holdMode: false,
  /* ask for the microphone up front so the system prompt never lands mid-question */
  requestPermission: function(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve(Voice.supported);
    return navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
      st.getTracks().forEach(function(tr){ tr.stop(); });
      return true;
    }).catch(function(){ return false; });
  },
  start: function(onResult, onState){
    if (!Voice.supported){ if (onState) onState("unsupported"); return false; }
    Voice.cancel();
    var R = window.SpeechRecognition || window.webkitSpeechRecognition;
    try { if (Voice.rec) Voice.rec.abort(); } catch(e){}
    var r = new R();
    Voice.rec = r; Voice.onResult = onResult; Voice.onState = onState; Voice._final = "";
    r.lang = localeTag(); r.interimResults = true; r.continuous = !!Voice.holdMode; r.maxAlternatives = 1;
    r.onstart = function(){ Voice.listening = true; if (onState) onState("listening"); log("mic_start"); };
    r.onresult = function(e){
      var fin = "", itr = "";
      for (var i = e.resultIndex; i < e.results.length; i++){
        var txt = e.results[i][0].transcript;
        if (e.results[i].isFinal) fin += txt; else itr += txt;
      }
      if (fin) Voice._final += fin;
      if (onState) onState("partial", Voice._final + itr);
    };
    r.onerror = function(e){ log("mic_error", e.error); if (onState) onState("error", e.error); };
    r.onend = function(){
      Voice.listening = false;
      var txt = (Voice._final || "").trim();
      log("mic_end", txt ? txt.slice(0,120) : "(empty)");
      if (onState) onState("ended");
      if (txt && onResult) onResult(txt);
      else if (onState) onState("empty");
    };
    try { r.start(); return true; }
    catch(e){ if (onState) onState("error", String(e)); return false; }
  },
  stop: function(){ try { if (Voice.rec) Voice.rec.stop(); } catch(e){} }
};
if (window.speechSynthesis){
  Voice.loadVoices();
  speechSynthesis.onvoiceschanged = Voice.loadVoices;
}
window.KG.Voice = Voice;

/* ============================================================
   KALA — Claude client (live) with a guided offline fallback
   ============================================================ */
var Kala = {
  online: function(){ return navigator.onLine !== false; },
  live: function(){
    if (S.cfg.brain === "guided") return false;
    return !!S.cfg.apiKey && Kala.online();
  },
  _fails: 0,

  call: function(opts){
    /* opts: {system, messages, max, json} -> Promise<string> */
    var body = {
      model: S.cfg.model || "claude-sonnet-5",
      max_tokens: opts.max || 900,
      system: opts.system,
      messages: opts.messages
    };
    return fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": S.cfg.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify(body)
    }).then(function(r){
      if (!r.ok) return r.text().then(function(tx){ throw new Error(r.status+" "+tx.slice(0,200)); });
      return r.json();
    }).then(function(d){
      Kala._fails = 0;
      return (d.content||[]).filter(function(b){ return b.type === "text"; })
        .map(function(b){ return b.text; }).join("\n").trim();
    }).catch(function(err){
      Kala._fails++;
      log("ai_error", String(err).slice(0,180));
      throw err;
    });
  },

  json: function(opts){
    return Kala.call(opts).then(function(txt){
      var s = txt.replace(/```json/gi,"").replace(/```/g,"").trim();
      var a = s.indexOf("{"), b = s.lastIndexOf("}");
      if (a >= 0 && b > a) s = s.slice(a, b+1);
      return JSON.parse(s);
    });
  }
};
window.KG.Kala = Kala;

/* language name for prompts */
window.KG.langName = function(){ return {mr:"Marathi (मराठी)", hi:"Hindi (हिन्दी)", en:"simple Indian English"}[L()]; };

/* ---------------- photos ---------------- */
var MAX_PHOTOS = 5;
window.KG.MAX_PHOTOS = MAX_PHOTOS;

/* decode one file and downscale it so it fits in storage and in an API call */
function shrinkFile(file, max, cb){
  if (!file || !/^image\//.test(file.type || "")){
    log("photo_reject", (file && file.type) || "no type"); cb(null); return;
  }
  var done = false;
  var finish = function(d){ if (done) return; done = true; cb(d); };
  var draw = function(src, revoke){
    var img = new Image();
    img.onload = function(){
      var sc = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width*sc));
      c.height = Math.max(1, Math.round(img.height*sc));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      if (revoke) URL.revokeObjectURL(src);
      var q = 0.78, out = c.toDataURL("image/jpeg", q);
      /* keep each photo under ~180KB so several fit alongside the rest of the session */
      while (out.length > 240000 && q > 0.42){ q -= 0.12; out = c.toDataURL("image/jpeg", q); }
      finish(out);
    };
    img.onerror = function(){
      if (revoke) URL.revokeObjectURL(src);
      log("photo_decode_fail", file.type);
      finish(null);
    };
    img.src = src;
  };
  try { draw(URL.createObjectURL(file), true); }
  catch(e){
    var fr = new FileReader();
    fr.onload = function(){ draw(fr.result, false); };
    fr.onerror = function(){ finish(null); };
    fr.readAsDataURL(file);
  }
}

/* decode a whole FileList in order, skipping anything the browser cannot read */
function shrinkFiles(files, max, cb){
  var list = Array.prototype.slice.call(files || []).slice(0, MAX_PHOTOS);
  var out = [], i = 0, skipped = 0;
  (function next(){
    if (i >= list.length){ cb(out, skipped); return; }
    shrinkFile(list[i++], max, function(d){ if (d) out.push(d); else skipped++; next(); });
  })();
}
window.KG.shrinkFile = shrinkFile;
window.KG.shrinkFiles = shrinkFiles;

/* wire a pair of hidden inputs (camera + gallery) to one handler */
window.KG.wirePickers = function(camId, galId, onPhotos, opts){
  opts = opts || {};
  [camId, galId].forEach(function(id){
    var el = document.getElementById(id); if (!el) return;
    el.onchange = function(){
      var files = el.files;
      if (!files || !files.length) return;
      log("photo_picked", id + ":" + files.length);
      var busy = document.getElementById("pickBusy");
      if (busy) busy.style.display = "grid";
      shrinkFiles(files, opts.max || 1100, function(list, skipped){
        if (busy) busy.style.display = "none";
        el.value = "";
        if (!list.length){
          toast(L3("That file could not be opened. Try taking a photo instead.",
                   "ही फाइल उघडता आली नाही. त्याऐवजी फोटो काढून बघा.",
                   "यह फाइल खुल नहीं सकी. इसके बजाय फोटो लेकर देखिए."));
          return;
        }
        if (skipped) toast(skipped + " " + L3("file(s) could not be opened","फाइल उघडता आली नाही","फाइल नहीं खुली"));
        onPhotos(list);
      });
    };
  });
};
function L3(en, mr, hi){ return L()==="mr"?mr : L()==="hi"?hi : en; }
window.KG.L3 = L3;

/* the hidden inputs + a "reading photo" veil, reused by every picker screen */
window.KG.pickerInputs = function(camId, galId, multiple, facing){
  return '<input type="file" id="'+camId+'" accept="image/*" capture="'+(facing||"environment")+'" hidden>'+
         '<input type="file" id="'+galId+'" accept="image/*"'+(multiple?" multiple":"")+' hidden>'+
         '<div id="pickBusy" style="position:absolute;inset:0;z-index:70;background:rgba(250,250,250,.92);display:none;place-items:center">'+

/* ============================================================
   COACH MARKS — spotlight + spoken caption, for first-time screens
   ============================================================ */
var COACH = null;
function coach(key, steps, done){
  if (S.coach[key] && !COACH_FORCE){ if (done) done(); return; }
  COACH = {key:key, steps:steps, i:0, done:done};
  drawCoach();
}
var COACH_FORCE = false;
window.KG.coach = coach;
window.KG.replayCoach = function(key, steps, done){ COACH_FORCE = true; coach(key, steps, done); };

function drawCoach(){
  var ph = document.getElementById("phone");
  var old = ph.querySelector(".coach"); if (old) old.remove();
  if (!COACH) return;
  var st = COACH.steps[COACH.i];
  var el = st.sel ? document.querySelector(st.sel) : null;
  var box = el ? el.getBoundingClientRect() : null;
  var pb = ph.getBoundingClientRect();
  var wrap = document.createElement("div"); wrap.className = "coach";

  var hole = "", beak = "", pos = "top:50%;transform:translateY(-50%)";
  if (box){
    var pad = st.pad === undefined ? 8 : st.pad;
    var x = box.left - pb.left - pad, y = box.top - pb.top - pad,
        w = box.width + pad*2, h = box.height + pad*2;
    hole = '<div class="hole" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;border-radius:'+(st.round||20)+'px"></div>';
    var below = (y + h) < pb.height * 0.56;
    pos = below ? ("top:" + (y + h + 16) + "px") : ("bottom:" + (pb.height - y + 16) + "px");
    var bx = Math.max(28, Math.min(pb.width - 44, x + w/2 - 8));
    beak = '<div class="beak" style="left:'+bx+'px;'+(below ? "top:"+(y+h+9)+"px" : "top:"+(y-25)+"px")+'"></div>';
  }
  var last = COACH.i === COACH.steps.length - 1;
  wrap.innerHTML = hole + beak +
    '<div class="coachcard" style="'+pos+'">'+
      '<div class="lead">'+esc(st.title)+'</div>'+
      '<p>'+esc(st.body)+'</p>'+
      '<div class="rowend">'+
        '<div class="steps">'+COACH.steps.map(function(_,i){
          return '<i class="'+(i===COACH.i?"on":"")+'"></i>'; }).join("")+'</div>'+
        '<button class="cta sm" data-act="coachNext">'+esc(last ? t("gotIt") : t("next"))+'</button>'+
      '</div>'+
    '</div>';
  ph.appendChild(wrap); bind(wrap);
  Voice.speak(st.title + ". " + st.body);
}
act("coachNext", function(){
  if (!COACH) return;
  COACH.i++;
  if (COACH.i >= COACH.steps.length){
    S.coach[COACH.key] = 1; save(); COACH_FORCE = false;
    var d = COACH.done; COACH = null;
    var ph = document.getElementById("phone");
    var el = ph.querySelector(".coach"); if (el) el.remove();
    Voice.cancel();
    if (d) d();
    return;
  }
  drawCoach();
});

/* ============================================================
   DEVICE FRAME — draw the phone inside a bezel on a desktop window
   ============================================================ */
function fitFrame(){
  var wide = window.matchMedia("(min-width:560px)").matches &&
             window.matchMedia("(min-height:520px)").matches &&
             window.matchMedia("(hover:hover)").matches;
  document.body.classList.toggle("framed", wide);
  if (!wide){ document.body.style.removeProperty("--fit"); return; }
  /* 30px of breathing room around the bezel, never scaled up past life size */
  var s = Math.min(1, (window.innerHeight - 60) / 852, (window.innerWidth - 60) / 393);
  document.body.style.setProperty("--fit", Math.max(0.35, s).toFixed(3));
  var el = document.getElementById("sbtime");
  if (el) el.textContent = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
}
var fl = document.getElementById("framelabel");
if (fl){
  fl.innerHTML = 'Karagir prototype <button id="restartbtn">Start again</button>';
  fl.addEventListener("click", function(e){
    if (e.target && e.target.id === "restartbtn") window.KG.restart();
  });
}
window.addEventListener("resize", fitFrame);
window.addEventListener("orientationchange", fitFrame);
fitFrame();
setInterval(function(){
  var el = document.getElementById("sbtime");
  if (el && document.body.classList.contains("framed"))
    el.textContent = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
}, 30000);
window.KG.fitFrame = fitFrame;

/* boot after all views registered */
window.KG.boot = function(){
  /* until setup is finished, every launch starts at the splash */
  render(S.onboarded ? "home" : "splash");
};
window.KG.restart = function(){
  var cfg = JSON.parse(JSON.stringify(S.cfg));
  var fresh = JSON.parse(JSON.stringify(DEFAULT));
  fresh.cfg = cfg;
  try { localStorage.setItem(KEY, JSON.stringify(fresh)); } catch(e){}
  try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
  location.reload();
};
/* typing #fresh on an already-open page is a same-document navigation,
   so nothing re-runs unless we listen for it */
window.addEventListener("hashchange", function(){
  if (location.hash === "#fresh") window.KG.restart();
});

})();
</script>
<script>
/* ============================================================
   KARAGIR v2 — setup flow
   One decision per screen. Voice first. Nothing to read to proceed.
   ============================================================ */
(function(){
"use strict";
var K = window.KG, S = K.S, t = K.t, te = K.te, esc = K.esc, ic = K.ic;
var go = K.go, view = K.view, after = K.after, act = K.act, save = K.save, log = K.log;
var Voice = K.Voice, Kala = K.Kala, toast = K.toast;

function L2(en, mr, hi){ return K.L()==="mr"?mr : K.L()==="hi"?hi : en; }
K.L2n = L2;

/* both lines: the person's language large, English quietly beneath */
function two(k, cls){
  var b = te(k);
  return '<div class="'+(cls||"ask")+'">'+esc(t(k))+'</div>' + (b ? '<div class="gloss">'+esc(b)+'</div>' : '');
}
K.two = two;

/* ============================================================
   MIC DOCK — hold to talk (the WhatsApp gesture), tap also works
   ============================================================ */
var micState = "idle", tapMode = false, holdStart = 0, micHandler = null;

function micDock(opts){
  opts = opts || {};
  return '<div class="dock" id="dock">'+
    '<div class="micwrap">'+
      '<div class="miccap" id="miccap"></div>'+
      '<button class="mic" id="micbtn" aria-label="'+esc(t("holdToTalk"))+'">'+ic("mic",36,"#fff",2.1)+'</button>'+
      '<button class="cta text" id="typetoggle" style="min-height:36px;font-size:14.5px">'+esc(t("typeInstead"))+'</button>'+
      '<div id="typerow" hidden style="width:100%">'+
        '<div class="typebar"><input id="typein" placeholder="'+esc(t("askKala"))+'" autocomplete="off">'+
        '<button class="send" id="sendbtn" aria-label="'+esc(t("next"))+'">'+ic("send",19,"#fff")+'</button></div>'+
      '</div>'+
    '</div></div>';
}
function setMic(state, live){
  micState = state;
  var b = document.getElementById("micbtn"), c = document.getElementById("miccap");
  if (!b || !c) return;
  b.className = "mic" + (state==="listening" ? " hot" : (state==="busy"||state==="speaking" ? " wait" : ""));
  if (live){ c.innerHTML = esc(live); return; }
  var main, sub = "";
  if (state === "listening"){
    main = t("listening");
    sub = tapMode ? L2("Tap again when you finish","बोलून झाल्यावर पुन्हा दाबा","बोलकर फिर दबाइए") : t("releaseDone");
  } else if (state === "busy"){ main = t("thinking"); }
  else if (state === "speaking"){ main = t("speaking"); }
  else { main = t("holdToTalk"); sub = te("holdToTalk"); }
  c.innerHTML = esc(main) + (sub ? '<small>'+esc(sub)+'</small>' : "");
}
function beginListen(){
  if (!Voice.supported){ showType(); toast(t("micBlocked")); return; }
  Voice.holdMode = true;
  Voice.start(function(txt){ if (micHandler) micHandler(txt); }, function(st, data){
    if (st === "listening") setMic("listening");
    else if (st === "partial") setMic("listening", data);
    else if (st === "ended") setMic("idle");
    else if (st === "empty"){ setMic("idle"); toast(t("tapAgain")); }
    else if (st === "error"){ setMic("idle"); showType(); toast(t("micBlocked")); }
    else if (st === "unsupported"){ showType(); }
  });
}
function showType(){
  var row = document.getElementById("typerow");
  if (row && row.hidden){ row.hidden = false; K.fitDock(); }
}
function wireMic(onText){
  micHandler = onText; tapMode = false;
  var b = document.getElementById("micbtn");
  var tg = document.getElementById("typetoggle"), row = document.getElementById("typerow"),
      inp = document.getElementById("typein"), snd = document.getElementById("sendbtn");
  setMic("idle");
  if (tg) tg.onclick = function(){ row.hidden = !row.hidden; K.fitDock(); if (!row.hidden) inp.focus(); log("type_toggle"); };
  function sendTyped(){ var v = (inp.value||"").trim(); if (!v) return; inp.value = ""; log("typed", v.slice(0,120)); onText(v); }
  if (snd) snd.onclick = sendTyped;
  if (inp) inp.addEventListener("keydown", function(e){ if (e.key === "Enter") sendTyped(); });
  if (!b) return;

  b.addEventListener("pointerdown", function(e){
    e.preventDefault();
    if (micState === "busy" || micState === "speaking"){ Voice.cancel(); }
    if (Voice.listening && tapMode){ tapMode = false; Voice.stop(); return; }
    holdStart = Date.now(); tapMode = false;
    beginListen();
  });
  function release(){
    if (!Voice.listening) return;
    if (Date.now() - holdStart < 500){ tapMode = true; setMic("listening"); return; }
    Voice.stop();
  }
  b.addEventListener("pointerup", release);
  b.addEventListener("pointercancel", release);
  b.addEventListener("pointerleave", function(){ if (!tapMode) release(); });
}
K.micDock = micDock; K.setMic = setMic; K.wireMic = wireMic;

function kalaSay(text, done){
  if (!S.cfg.autoSpeak){ if (done) done(); return; }
  if (document.getElementById("micbtn")) setMic("speaking");
  Voice.speak(text, function(){ if (document.getElementById("micbtn")) setMic("idle"); if (done) done(); });
}

          '<span class="glyph">'+ic("speak",21,"#6F0004")+'</span>'+

          '<span class="mark">'+(langPick===l.c?ic("check",13,"#fff",3.2):"")+'</span></button>';
      }).join("")+
    '</div>'+
  '</div>'+
  '<div class="foot"><button class="cta" data-act="langNext" '+(langPick?'':'disabled')+'>'+
    esc(langPick ? t("getStarted") : "Choose your language")+'</button></div>';
});

/* ============================================================

view("micIntro", function(){

  '<div class="pad" style="padding-top:16px">'+

var STEPS = [
  {k:"name",      q:"qName",      h:"qNameH"},
  {k:"place",     q:"qPlace",     h:"qPlaceH"},
  {k:"community", q:"tribeQ",     h:"tribeQH",     optional:true, tribes:true},
  {k:"craft",     q:"qCraft",     h:"qCraftH"},
  {k:"learn",     q:"qLearn",     h:"qLearnH"},
  {k:"years",     q:"qYears",     chips:["yrsNew","yrs1","yrs5","yrs10"]},
  {k:"process",   q:"qProcess",   h:"qProcessH"},
  {k:"materials", q:"qMaterials", h:"qMaterialsH"},
  {k:"products",  q:"qProducts",  h:"qProductsH", multi:["pPainting","pWall","pDecor","pCloth","pOther"]}
];
var ACK = {
  name:      {mr:"नमस्कार {v}! तुम्हाला भेटून आनंद झाला.", hi:"नमस्ते {v}! आपसे मिलकर खुशी हुई.", en:"Hello {v}! Nice to meet you."},
  place:     {mr:"छान! {v} बद्दल ऐकून आनंद झाला.", hi:"बढ़िया! {v} के बारे में सुनकर अच्छा लगा.", en:"Wonderful! Good to know you're from {v}."},
  community: {mr:"धन्यवाद. तुमच्या कलेची ओळख जपून सांगण्यास मी मदत करेन.", hi:"धन्यवाद. आपकी कला की पहचान सम्मान से बताऊँगी.", en:"Thank you. I'll share your craft and heritage respectfully."},
  craft:     {mr:"छान! {v} तुमची मुख्य कला म्हणून जोडली आहे.", hi:"बढ़िया! {v} आपकी मुख्य कला के रूप में जोड़ दी है.", en:"Wonderful! I've added {v} as your main craft."},
  learn:     {mr:"खूप छान. हे तुमच्या कथेत जोडलं.", hi:"बहुत अच्छा. इसे आपकी कहानी में जोड़ दिया.", en:"That's wonderful. I've added it to your story."},
  years:     {mr:"नोंद केली.", hi:"नोट कर लिया.", en:"Noted."},
  process:   {mr:"समजलं. ही पद्धत तुमच्या कथेत जोडली.", hi:"समझ गई. यह तरीका आपकी कहानी में जोड़ा.", en:"Understood, I've added your process."},
  materials: {mr:"हे साहित्य नोंदवलं आहे.", hi:"यह सामग्री दर्ज कर ली.", en:"I've noted these materials."},
  products:  {mr:"छान. आता मला तुमचं काम बघायचं आहे.", hi:"बढ़िया. अब मुझे आपका काम देखना है.", en:"Great. Now I'd like to see your work."}
};
function ackFor(k, v){ var a = ACK[k]; return a ? (a[K.L()]||a.en).replace("{v}", v||"") : ""; }

var C = {msgs:[], idx:0, busy:false, sel:[]}, SKIP = {};
function slots(){ return S.profile; }
function nextStep(){
  for (var i=0;i<STEPS.length;i++){
    var st = STEPS[i], v = slots()[st.k];
    if (SKIP[st.k]) continue;
    if (st.k === "materials" || st.k === "products"){ if (!v || !v.length) return i; }
    else if (!v) return i;
  }
  return -1;
}
function startChat(manual){ C = {msgs:[], idx:0, busy:false, sel:[]}; SKIP = {}; go("chat", {manual:!!manual}); }

view("chat", function(){
  return K.head({})+ K.progress(Math.round((C.idx/(STEPS.length+3))*100))+
    '<div class="thread" id="thread"></div>'+ micDock();
});
after("chat", function(){
  paint(); wireMic(onUser);
  if (!C.msgs.length){ var i = nextStep(); C.idx = i < 0 ? 0 : i; askStep(C.idx, true); }
});
function paint(){
  var w = document.getElementById("thread"); if (!w) return;
  w.innerHTML = C.msgs.map(function(m, i){
    if (m.who === "me") return '<div class="msg mine"><div class="bub"><div class="lead">'+esc(m.text)+'</div></div></div>';
    if (m.typing) return '<div class="msg"><img class="av" src="'+KIMG.kalaDisc+'" alt=""><div class="bub"><div class="dots"><i></i><i></i><i></i></div></div></div>';
    return '<div class="msg"><img class="av" src="'+KIMG.kalaDisc+'" alt="">'+
      '<div class="bub"><div class="lead">'+esc(m.text)+'</div>'+
      (m.en ? '<div class="sub">'+esc(m.en)+'</div>' : '')+
      '<button class="hear" data-act="replay" data-arg="'+i+'">'+ic("speak",14)+esc(t("listen"))+'</button>'+
      '</div></div>'+ (m.extra || "");
  }).join("");
  K.bind(w);
  var sc = document.getElementById("screen"); sc.scrollTop = sc.scrollHeight;
  var p = document.querySelector(".bar i");
  if (p) p.style.width = Math.round((C.idx/(STEPS.length+3))*100)+"%";
}
act("replay", function(i){ var m = C.msgs[+i]; if (m) Voice.speak(m.text); });
function pushKala(text, en, extra){
  C.msgs = C.msgs.filter(function(m){ return !m.typing; });
  C.msgs.push({who:"kala", text:text, en:en||"", extra:extra||""});
  paint(); kalaSay(text);
}
function pushMe(text){ C.msgs.push({who:"me", text:text}); paint(); }
function pushTyping(){ C.msgs.push({who:"kala", typing:true}); paint(); }

function extras(step){
  var hint = step.h ? '<div class="small" style="margin:-6px 0 12px 44px">'+esc(t(step.h))+'</div>' : '';
  if (step.tribes){
    return hint + K.tribeGrid() +
      '<div class="chips"><button class="chip" data-act="skipStep">'+esc(t("tribeOther"))+'</button>'+
      '<button class="chip" data-act="skipStep">'+esc(t("skip"))+'</button></div>';
  }
  if (step.chips){
    return hint + '<div class="chips">'+step.chips.map(function(c){
      return '<button class="chip" data-act="chip" data-arg="'+c+'">'+esc(t(c))+'</button>'; }).join("")+'</div>';
  }
  if (step.multi){
    C.sel = [];
    return hint + '<div class="chips">'+step.multi.map(function(c){
      return '<button class="chip" aria-pressed="false" data-act="mchip" data-arg="'+c+'">'+esc(t(c))+'</button>'; }).join("")+
      '<button class="chip go" data-act="mdone">'+esc(t("continue"))+'</button></div>';
  }
  if (step.optional) return hint + '<div class="chips"><button class="chip" data-act="skipStep">'+esc(t("skip"))+'</button></div>';
  return hint;
}
act("chip", function(c){ pushMe(t(c)); applyAnswer(STEPS[C.idx].k, t(c), c); });
act("pickTribe", function(id){
  var tr = K.tribeById(id); if (!tr) return;
  S.profile.tribe = id; S.profile.community = K.tribeName(tr); save(); log("tribe", id);
  pushMe(K.tribeName(tr));
  var n = nextStep();
  var line = t("tribeSet") + (n >= 0 ? " " + t(STEPS[n].q) : "");
  if (n >= 0){ C.idx = n; pushKala(line, te(STEPS[n].q), extras(STEPS[n])); }
  else { pushKala(line); setTimeout(function(){ go("showWork"); }, 1000); }
});
act("mchip", function(c, node){
  var i = C.sel.indexOf(c);
  if (i >= 0){ C.sel.splice(i,1); node.setAttribute("aria-pressed","false"); }
  else { C.sel.push(c); node.setAttribute("aria-pressed","true"); }
});
act("mdone", function(){
  if (!C.sel.length){ toast(t("tapAgain")); return; }
  var labels = C.sel.map(function(c){ return t(c); });
  pushMe(labels.join(", ")); slots().products = labels; save(); advance();
});
act("skipStep", function(){
  var st = STEPS[C.idx]; slots()[st.k] = ""; SKIP[st.k] = 1; save();
  pushMe(t("skip")); advance();
});
function askStep(i, first){
  var st = STEPS[i]; if (!st){ go("showWork"); return; }
  C.idx = i;
  pushKala((first ? t("kalaHi")+" " : "") + t(st.q), te(st.q), extras(st));
}
function advance(){ var n = nextStep(); if (n < 0) go("showWork"); else askStep(n); }

function onUser(text){
  if (C.busy) return;
  pushMe(text);
  var st = STEPS[C.idx];
  if (Kala.live()){
    C.busy = true; setMic("busy"); pushTyping();
    extractLive(text, st).then(function(res){
      C.busy = false;
      Object.keys(res.slots||{}).forEach(function(k){
        var v = res.slots[k];
        if (v === null || v === undefined || v === "") return;
        if (k === "materials" || k === "products")
          slots()[k] = Array.isArray(v) ? v : String(v).split(/[,;]/).map(function(s){return s.trim();}).filter(Boolean);
        else slots()[k] = String(v);
      });
      save();
      var n = nextStep();
      var line = (res.reply || ackFor(st.k, slots()[st.k])) + (n >= 0 ? " " + t(STEPS[n].q) : "");
      if (n >= 0){ C.idx = n; pushKala(line, res.reply_en || te(STEPS[n].q), extras(STEPS[n])); }
      else { pushKala(line, res.reply_en || ""); setTimeout(function(){ go("showWork"); }, 1000); }
    }).catch(function(){
      C.busy = false;
      C.msgs = C.msgs.filter(function(m){ return !m.typing; });
      applyAnswer(st.k, text);
    });
  } else applyAnswer(st.k, text);
}
function applyAnswer(key, text, chipKey){
  if (key === "community"){
    var tr = K.matchTribe(text);
    if (tr){ S.profile.tribe = tr.id; text = K.tribeName(tr); }
  }
  if (key === "materials" || key === "products")
    slots()[key] = text.split(/[,;।]| आणि | और | and /).map(function(s){ return s.trim(); }).filter(Boolean);
  else if (key === "years" && chipKey) slots()[key] = t(chipKey);
  else slots()[key] = clean(key, text);
  save();
  var ack = ackFor(key, slots()[key]), n = nextStep();
  if (n < 0){ pushKala(ack); setTimeout(function(){ go("showWork"); }, 1000); return; }
  C.idx = n;
  pushKala(ack + " " + t(STEPS[n].q), te(STEPS[n].q), extras(STEPS[n]));
}
function clean(key, txt){
  var s = txt.trim();
  if (key === "name") s = s.replace(/^(माझं|माझे|मेरा)\s*नाव\s*/i,"").replace(/\s*(आहे|है)\.?$/i,"")
                          .replace(/^(my name is|i am|i'm)\s*/i,"").replace(/\.$/,"");
  if (key === "place") s = s.replace(/^(मी|मैं)\s*/,"").replace(/(मधून|मध्ये|से)\s*(आहे|हूँ|हूं)?\.?$/,"")
                            .replace(/^(i am from|i'm from|from)\s*/i,"").replace(/\.$/,"");
  return s.trim() || txt.trim();
}
function extractLive(text, st){
  var sys = "You are Kala, a warm, respectful assistant inside Karagir, an app for Indian artisans. "+
    "The artisan may have little formal literacy, so your spoken replies must be short, simple and kind: at most 18 words, no jargon, no lists, no emoji. "+
    "Reply in "+K.langName()+". You are collecting profile details from free speech. Extract every field the person mentioned, "+
    "even if they answered more than was asked. Never invent a value that was not said.\n"+
    "Fields: name, place, community, craft, learn, years (one of: "+
    [t("yrsNew"),t("yrs1"),t("yrs5"),t("yrs10")].join(" / ")+"), process, materials (array), products (array).\n"+
    "Return ONLY JSON: {\"reply\": string, \"reply_en\": string, \"slots\": {..only fields mentioned..}}. "+
    "\"reply\" is one warm sentence acknowledging what they said. Do not ask the next question — the app does that.";
  return Kala.json({system:sys, max:500, messages:[{role:"user", content:
    "Already known: "+JSON.stringify(slots())+"\nQuestion asked: "+t(st.q)+"\nThe artisan said: \""+text+"\""}]});
}

  return {style:c,
    notes: L2(["Traditional style","Human and animal figures","Scenes of nature and community"],

              ["पारंपरिक शैली","मानव और पशु आकृतियाँ","प्रकृति और समुदाय के दृश्य"]),
    materials: L2(["Natural colours","Handmade brush","Cloth or wall"],
                  ["नैसर्गिक रंग","हाताने बनवलेला ब्रश","कापड किंवा भिंत"],
                  ["प्राकृतिक रंग","हाथ से बना ब्रश","कपड़ा या दीवार"]),
    name: L2("Village Life","गावाचं जीवन","गाँव का जीवन"), name_en:"Village Life",
    story:"", story_en:"", priceLow:2500, priceHigh:6000};
};
K.visionAnalyse = function(dataUrl){
  if (!Kala.live() || !dataUrl || dataUrl.indexOf("data:image") !== 0) return Promise.reject();
  var m = dataUrl.match(/^data:(image\/[a-z+]+);base64,(.*)$/);
  if (!m) return Promise.reject();
  var sys = "You are Kala, helping an Indian artisan list handmade work. Describe the craft in the artisan's own register: "+
    "warm, plain, respectful, never art-critic language. Local fields in "+K.langName()+", _en fields in English. Return ONLY JSON: "+
    '{"style":string,"notes":[3 short phrases],"materials":[2-4 short names],"name":string,"name_en":string,'+
    '"story":string,"story_en":string,"priceLow":number,"priceHigh":number}. '+
    "story is two sentences about what the piece shows. priceLow/priceHigh are a fair retail range in Indian rupees.";
  return Kala.json({system:sys, max:800, messages:[{role:"user", content:[
    {type:"image", source:{type:"base64", media_type:m[1], data:m[2]}},
    {type:"text", text:"The artisan's craft: "+(S.profile.craft||"unknown")+". From: "+(S.profile.place||"India")+"."}]}]});
};
function showAnalysis(a){
  ANALYSIS = a;
  var el = document.getElementById("anout"); if (!el) return;
  el.className = "";
  el.innerHTML = '<div class="msg"><img class="av" src="'+KIMG.kalaDisc+'" alt=""><div class="bub">'+
      '<div class="lead">'+esc(t("iNoticed"))+'</div></div></div>'+
    '<div class="stack" style="margin:2px 0 16px 44px;gap:10px">'+
      (a.notes||[]).map(function(n){

function templateStory(){
  var p = S.profile;
  var mr = p.name+" हे "+(p.place||"")+" इथले "+(p.craft||"")+" कलाकार आहेत. "+
    (p.learn ? "त्यांनी ही कला "+p.learn+" शिकली. " : "")+(p.years ? p.years+" पासून ते ही कला करत आहेत. " : "")+
    "आपल्या कामातून ते आपल्या समुदायाचं जीवन, निसर्ग आणि परंपरा मांडतात.";
  var hi = p.name+" "+(p.place||"")+" के "+(p.craft||"")+" कलाकार हैं। "+
    (p.learn ? "उन्होंने यह कला "+p.learn+" सीखी। " : "")+(p.years ? p.years+" से वे यह कला कर रहे हैं। " : "")+
    "अपने काम में वे अपने समुदाय का जीवन, प्रकृति और परंपरा दिखाते हैं।";
  var en = p.name+" is a "+(p.craft||"craft")+" artist from "+(p.place||"India")+". "+
    (p.learn ? "They learned this craft "+p.learn+". " : "")+(p.years ? "They have been practising for "+p.years+". " : "")+
    "Their work shows the life, nature and traditions of their community.";
  return {story: K.L()==="mr"?mr:K.L()==="hi"?hi:en, story_en: en};
}
function buildStory(){
  if (!Kala.live()) return Promise.reject();
  var sys = "You are Kala. Write a short artisan biography for a Karagir profile using ONLY the facts given. "+
    "Never invent awards, exhibitions, dates or family details. Three sentences maximum. Warm and dignified, never flowery or pitying. "+
    "Return ONLY JSON: {\"story\": <in "+K.langName()+">, \"story_en\": <in English>}";
  return Kala.json({system:sys, max:600, messages:[{role:"user", content: JSON.stringify(S.profile)}]});
}
function paintStory(r){
  S.profile.story = r.story; S.profile.storyEn = r.story_en; save();
  var el = document.getElementById("stout"); if (!el) return;
  el.style.textAlign = "left";
  el.innerHTML = '<div class="msg"><img class="av" src="'+KIMG.kalaDisc+'" alt=""><div class="bub">'+
      '<div class="lead">'+esc(t("storyMade"))+'</div></div></div>'+
    '<div class="card wash" style="margin:14px 0 20px;padding:22px">'+
      '<div class="label">'+esc(t("yourStory"))+'</div>'+
      '<p style="font-size:17.5px;line-height:1.62">'+esc(r.story)+'</p>'+
      (K.L()==="en" ? "" : '<p class="small" style="margin-top:12px;line-height:1.5">'+esc(r.story_en)+'</p>')+
      '<button class="hear" data-act="sayStory">'+ic("speak",14)+esc(t("listen"))+'</button>'+
    '</div>'+
    '<div class="stack" style="padding-bottom:28px">'+
      '<button class="cta" data-act="storyOk">'+ic("check",21,"#fff",2.6)+esc(t("looksGood"))+'</button>'+
      '<button class="cta hollow" data-act="storyEdit">'+ic("pencil",19)+esc(t("editStory"))+'</button>'+
    '</div>';
  K.bind(el);
  Voice.speak(t("storyMade")+" "+r.story);
}
act("sayStory", function(){ Voice.speak(S.profile.story); });
act("storyOk", function(){ go("selfie"); });
/* editing the story is spoken like everything else — the ask screen carries the mic */
act("storyEdit", function(){
  K.ask({q:t("editStoryQ"), qEn:te("editStoryQ"), h:t("editStoryH"),
    onAnswer:function(v){ applyStoryEdit(String(v).trim()); }});
});
function applyStoryEdit(said){
  go("makeStory", null, true);
  var done = function(r){
    S.profile.story = r.story;
    S.profile.storyEn = r.story_en || S.profile.storyEn;
    save(); toast(t("storyUpdated"));
    paintStory({story:S.profile.story, story_en:S.profile.storyEn});
  };
  if (!Kala.live()){ done({story: S.profile.story + " " + said}); return; }
  var sys = "You are Kala. Rewrite the artisan's biography so it takes account of the change they just asked for. " +
    "Keep every fact that is still true, add nothing they did not say, three sentences maximum, warm and dignified. " +
    "Return ONLY JSON: {\"story\": <in " + K.langName() + ">, \"story_en\": <in English>}";
  Kala.json({system: sys, max: 600, messages: [{role:"user", content:
    "Current story: " + S.profile.story + "\nProfile: " + JSON.stringify(S.profile) +
    "\nThe artisan asked for this change: \"" + said + "\""}]})
    .then(done).catch(function(){ done({story: S.profile.story + " " + said}); });
}

function paintSearch(){
  var el = document.getElementById("sqout"); if (!el) return;
  if (!SQ.q){
    el.innerHTML = '<div class="card wash"><p style="font-size:15.5px;line-height:1.5;color:var(--muted)">'+
      esc(L2('Try: "show my paintings", "how much did I earn", "who ordered from me"',

             'जैसे: "मेरे चित्र दिखाइए", "मुझे कितने पैसे मिले", "किसने ऑर्डर दिया"'))+'</p></div>';
    return;
  }
  el.innerHTML =
    '<div class="msg mine"><div class="bub"><div class="lead">'+esc(SQ.q)+'</div></div></div>'+
    (SQ.answer
      ? '<div class="msg"><img class="av" src="'+KIMG.kalaDisc+'" alt=""><div class="bub"><div class="lead">'+esc(SQ.answer)+'</div>'+
        '<button class="hear" data-act="saySearch">'+ic("speak",14)+esc(t("listen"))+'</button></div></div>'
      : '<div class="msg"><img class="av" src="'+KIMG.kalaDisc+'" alt=""><div class="bub"><div class="dots"><i></i><i></i><i></i></div></div></div>')+
    (SQ.results.length
      ? '<div class="stack" style="margin-top:6px">'+SQ.results.map(function(it){
          return '<button class="listrow" data-act="openItem" data-arg="'+it.id+'"><img class="th" src="'+it.photo+'" alt="">'+
            '<span class="mid"><b>'+esc(it.name)+'</b><span>'+(it.price?money(it.price):esc(t("qPrice")))+'</span></span>'+
            ic("chev",19,"#9AA1AC")+'</button>'; }).join("")+'</div>'
      : "");
  K.bind(el);
}
act("saySearch", function(){ Voice.speak(SQ.answer); });
function runSearch(q){
  SQ.q = q; SQ.answer = ""; SQ.results = []; paintSearch();
  K.setMic("busy"); log("search", q.slice(0,80));
  var low = q.toLowerCase();
  SQ.results = S.items.filter(function(it){
    return (it.name||"").toLowerCase().indexOf(low) >= 0 || (it.story||"").toLowerCase().indexOf(low) >= 0;
  });
  var fin = function(a){ SQ.answer = a; paintSearch(); K.kalaSay(a); };
  if (!Kala.live()){
    fin(SQ.results.length
      ? L2("Here is what I found.","हे मला सापडलं.","यह मुझे मिला.")
      : L2("I could not find that. Try saying it another way.","हे सापडलं नाही. वेगळ्या शब्दांत सांगा.","यह नहीं मिला. दूसरे शब्दों में बताइए."));
    return;
  }
  var facts = {artisan:S.profile.name, craft:S.profile.craft, place:S.profile.place,
    products:S.items.map(function(i){ return {name:i.name, price:i.price, published:i.published}; }),
    earnedThisMonth:S.earnings.paid, pending:S.earnings.pending,
    orders:S.orders.map(function(o){ return {from:o.from, type:o.type, item:o.item, amount:o.amount, status:o.status}; })};
  Kala.call({
    system:"You are Kala inside Karagir. Answer the artisan's spoken question using ONLY the data given. "+
      "Two short spoken sentences at most, in "+K.langName()+". Plain words, no lists, no emoji. "+
      "If the data does not contain the answer, say so simply.",
    max:300, messages:[{role:"user", content:"Data: "+JSON.stringify(facts)+"\nThey asked: \""+q+"\""}]
  }).then(fin).catch(function(){ fin(L2("I could not reach the network.","नेटवर्क मिळालं नाही.","नेटवर्क नहीं मिला.")); });
}

/* Kala looks at what is thin in the listing and asks about it, up to twice */
function fallbackProbe(){
  var opts = [];
  if (!draft.materials || draft.materials.length < 2)
    opts.push(L2("What did you use to make this?","हे बनवायला तुम्ही काय वापरलं?","इसे बनाने में आपने क्या इस्तेमाल किया?"));
  if (!draft.story || draft.story.length < 40)
    opts.push(L2("What does this piece show?","या कलाकृतीत काय दाखवलं आहे?","इस कलाकृति में क्या दिखाया है?"));
  opts.push(L2("Is there anything special a buyer should know?","खरेदीदाराला आवर्जून सांगावं असं काही आहे का?","खरीदार को खास बताने लायक कुछ है?"));
  return opts[Math.min(draft.probes || 0, opts.length - 1)];
}
function probe(){
  if ((draft.probes || 0) >= 2){ go("review"); return; }
  var ask = function(q){
    K.ask({pct:76, photo:draft.photo, q:q, h:t("anythingElse"),
      chips:[{label:t("nothingElse"), value:"__done__"}],
      onAnswer:function(v){
        if (v === "__done__"){ go("review"); return; }
        draft.probes = (draft.probes || 0) + 1;
        draft.extra = (draft.extra ? draft.extra + " " : "") + String(v).trim();
        draft.story = (draft.story ? draft.story + " " : "") + String(v).trim();
        log("probe_answered", String(v).slice(0,60));
        toast(t("addedThat"));
        probe();
      }});
  };
  if (!Kala.live()){ ask(fallbackProbe()); return; }
  Kala.json({system:"You are Kala, helping an Indian artisan finish a craft listing. Look at what the listing already has "+
      "and ask ONE short spoken question about the single most useful thing still missing — materials, technique, what the "+
      "piece shows, care, or who it suits. At most 14 words, in "+K.langName()+". Never ask about something already answered. "+
      "Return ONLY JSON: {\"q\": string}",
    max:200, messages:[{role:"user", content: JSON.stringify({craft:S.profile.craft, name:draft.name,
      story:draft.story, size:draft.size, time:draft.time, materials:draft.materials,
      alreadyAsked:draft.extra || ""})}]})
    .then(function(r){ ask(r.q || fallbackProbe()); })
    .catch(function(){ ask(fallbackProbe()); });
}
